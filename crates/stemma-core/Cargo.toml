[package]
name = "stemma-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
blake3 = "1"
getrandom = { version = "0.4.3", features = ["std"] }
unicode-general-category = "=1.1.0"

# The effective user of the process, for the owner check of `Repository::discover` (ADR-009).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["std", "process"] }

# `cargo fuzz` builds with `--cfg fuzzing`, which turns on the checks of the fuzz targets
# (`src/fuzz.rs`, `fuzz/`).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
