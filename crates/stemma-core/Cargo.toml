[package]
name = "stemma-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1"
caseless = "0.2.2"
getrandom = { version = "0.4.3", features = ["std"] }
unicode-general-category = "=1.1.0"
unicode-normalization = "0.1.26"

# The effective user of the process, for the owner check of `Repository::discover` (ADR-009).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["std", "process"] }

# The owner SID of a `.stemma` and the SIDs of the token of the process, for the same check on
# Windows (ADR-009, STEMMA-73).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

# `cargo fuzz` builds with `--cfg fuzzing`, which turns on the checks of the fuzz targets
# (`src/fuzz.rs`, `fuzz/`).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
