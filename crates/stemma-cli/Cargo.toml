[package]
name = "stemma-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "stemma"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
stemma-core = { path = "../stemma-core" }
