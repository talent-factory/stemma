# norma/rule-packs/safety/community.yaml
#
# Rules adopted from permissively licensed external ast-grep rule repositories on GitHub.
# Each rule names its source and licence in the comment above its id.
#
# Copy for Stemma (see norma/README.md). A rule that differs from the original
# carries the comment `Local change (Stemma)`.
---
# Source: https://github.com/joshuadavidthomas/ast-grep-rules/blob/main/rules/rust-no-panicking-let-else.yml
# License: MIT
# Local change (Stemma): severity error -> warning; an `unreachable!` with a reason states an invariant.
id: rust-no-panicking-let-else
language: Rust
severity: warning
message: "Do not end a let-else branch with a panic; handle the failed pattern without crashing."
note: "A panicking Option or Result let-else is expect under another spelling. Return an error or fallback, or model the invariant so the failed pattern is impossible. Test files and items under #[cfg(test)] or a test attribute are skipped."
ignores:
  - "**/tests.rs"
  - "**/tests/**"
  - "**/*_test.rs"
  - "**/*_tests.rs"
utils:
  test-attribute:
    kind: attribute_item
    regex: "^#\\[(cfg\\(test\\)|(\\w+::)*test(_case)?\\b|rstest\\b)"
  test-item:
    any:
      - kind: function_item
      - kind: mod_item
      - kind: impl_item
    follows:
      matches: test-attribute
      stopBy:
        not:
          any:
            - kind: attribute_item
            - kind: line_comment
            - kind: block_comment
rule:
  all:
    - any:
        - pattern: "let $PATTERN = $VALUE else { $MACRO!($$$ARGS) };"
        - pattern: "let $PATTERN = $VALUE else { $$$BODY; $MACRO!($$$ARGS) };"
        - pattern: "let $PATTERN = $VALUE else { panic!($$$ARGS); };"
        - pattern: "let $PATTERN = $VALUE else { unreachable!($$$ARGS); };"
        - pattern: "let $PATTERN = $VALUE else { todo!($$$ARGS); };"
        - pattern: "let $PATTERN = $VALUE else { unimplemented!($$$ARGS); };"
        - pattern: "let $PATTERN = $VALUE else { $$$BODY; panic!($$$ARGS); };"
        - pattern: "let $PATTERN = $VALUE else { $$$BODY; unreachable!($$$ARGS); };"
        - pattern: "let $PATTERN = $VALUE else { $$$BODY; todo!($$$ARGS); };"
        - pattern: "let $PATTERN = $VALUE else { $$$BODY; unimplemented!($$$ARGS); };"
    - not:
        inside:
          matches: test-item
          stopBy: end
constraints:
  MACRO:
    regex: "^(panic|unreachable|todo|unimplemented)$"
---
# Source: https://github.com/joshuadavidthomas/ast-grep-rules/blob/main/rules/rust-no-panicking-match-arm.yml
# License: MIT
# Local change (Stemma): severity error -> warning; an `unreachable!` with a reason states an invariant.
id: rust-no-panicking-match-arm
language: Rust
severity: warning
message: "Do not end a match arm with a panic; handle the failed pattern without crashing."
note: "A match whose Err, None, or wildcard arm panics is expect under another spelling, and wrapping the match in a helper only relabels it. Return or propagate an error, give the arm a real value, or model the invariant so the arm is impossible. Test files and items under #[cfg(test)] or a test attribute are skipped. A deliberate process-boundary abort needs an ast-grep-ignore comment with the reason."
ignores:
  - "**/tests.rs"
  - "**/tests/**"
  - "**/*_test.rs"
  - "**/*_tests.rs"
utils:
  test-attribute:
    kind: attribute_item
    regex: "^#\\[(cfg\\(test\\)|(\\w+::)*test(_case)?\\b|rstest\\b)"
  test-item:
    any:
      - kind: function_item
      - kind: mod_item
      - kind: impl_item
    follows:
      matches: test-attribute
      stopBy:
        not:
          any:
            - kind: attribute_item
            - kind: line_comment
            - kind: block_comment
  panicking-arm:
    kind: match_arm
    has:
      field: value
      any:
        - pattern: $MACRO!($$$ARGS)
        - pattern: "{ $MACRO!($$$ARGS) }"
        - pattern: "{ $$$BODY; $MACRO!($$$ARGS) }"
        - pattern: "{ panic!($$$ARGS); }"
        - pattern: "{ unreachable!($$$ARGS); }"
        - pattern: "{ todo!($$$ARGS); }"
        - pattern: "{ unimplemented!($$$ARGS); }"
        - pattern: "{ $$$BODY; panic!($$$ARGS); }"
        - pattern: "{ $$$BODY; unreachable!($$$ARGS); }"
        - pattern: "{ $$$BODY; todo!($$$ARGS); }"
        - pattern: "{ $$$BODY; unimplemented!($$$ARGS); }"
rule:
  all:
    - matches: panicking-arm
    - not:
        inside:
          matches: test-item
          stopBy: end
    - not:
        inside:
          any:
            - kind: const_item
            - kind: static_item
          stopBy: end
constraints:
  MACRO:
    regex: "^(panic|unreachable|todo|unimplemented)$"
