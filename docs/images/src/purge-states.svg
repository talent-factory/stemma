<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 600" font-family="Helvetica, Arial, sans-serif">
<title>Zustände eines Purge mit --resume und --abort</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
  </marker>
</defs>
<rect x="0" y="0" width="580" height="600" fill="#FFFFFF"/>
<!-- Steps of a purge with the apply option -->
<g stroke="#64748B" stroke-width="1" fill="#FFFFFF">
  <rect x="20" y="20" width="250" height="40" rx="4"/>
  <rect x="20" y="84" width="250" height="40" rx="4"/>
  <rect x="20" y="148" width="250" height="40" rx="4"/>
  <rect x="20" y="212" width="250" height="40" rx="4"/>
  <rect x="20" y="276" width="250" height="40" rx="4"/>
  <rect x="20" y="340" width="250" height="40" rx="4" stroke="#6B46C1" stroke-width="2"/>
  <rect x="20" y="404" width="250" height="40" rx="4"/>
  <rect x="20" y="468" width="250" height="40" rx="4"/>
  <rect x="20" y="532" width="250" height="40" rx="4"/>
</g>
<g>
  <rect x="20" y="20" width="8" height="40" fill="#B45309"/>
  <rect x="20" y="84" width="8" height="40" fill="#64748B"/>
  <rect x="20" y="148" width="8" height="40" fill="#64748B"/>
  <rect x="20" y="212" width="8" height="40" fill="#64748B"/>
  <rect x="20" y="276" width="8" height="40" fill="#64748B"/>
  <rect x="20" y="340" width="8" height="40" fill="#6B46C1"/>
  <rect x="20" y="404" width="8" height="40" fill="#2F7D32"/>
  <rect x="20" y="468" width="8" height="40" fill="#6B46C1"/>
  <rect x="20" y="532" width="8" height="40" fill="#64748B"/>
</g>
<g font-size="13" font-weight="bold" fill="#0F172A">
  <text x="40" y="37" fill="#B45309">1  Snapshot</text>
  <text x="40" y="101">2  Sperre nehmen, neu planen</text>
  <text x="40" y="165">3  Format 4, Journal schreiben</text>
  <text x="40" y="229">4  Neue Bäume und Commits</text>
  <text x="40" y="293">5  Zeiger prüfen</text>
  <text x="40" y="357" fill="#6B46C1">6  Eintrag <tspan font-family="Courier, monospace">purge</tspan> schreiben</text>
  <text x="40" y="421" fill="#2F7D32">7  Zeiger bewegen</text>
  <text x="40" y="485" fill="#6B46C1">8  Stubs, alte Objekte löschen</text>
  <text x="40" y="549">9  Journal entfernen</text>
</g>
<g font-size="11.5" fill="#64748B">
  <text x="56" y="53">das Verzeichnis festhalten</text>
  <text x="56" y="117"><tspan font-family="Courier, monospace">refs.lock</tspan>, bis zum Ende gehalten</text>
  <text x="56" y="181"><tspan font-family="Courier, monospace">.stemma/purge-pending</tspan></text>
  <text x="56" y="245">ohne den Blob</text>
  <text x="56" y="309">jeder noch auf dem alten Wert</text>
  <text x="56" y="373">Zahl der Commits, Nummern der Stubs</text>
  <text x="56" y="437">Branches, Working-Copy-Commit, HEAD</text>
  <text x="56" y="501">Commits, Bäume, zuletzt der Blob</text>
  <text x="56" y="565">der Purge ist fertig</text>
</g>
<!-- Arrows between the steps -->
<g stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)">
  <line x1="145" y1="60" x2="145" y2="82"/>
  <line x1="145" y1="124" x2="145" y2="146"/>
  <line x1="145" y1="188" x2="145" y2="210"/>
  <line x1="145" y1="252" x2="145" y2="274"/>
  <line x1="145" y1="316" x2="145" y2="338"/>
  <line x1="145" y1="380" x2="145" y2="402"/>
  <line x1="145" y1="444" x2="145" y2="466"/>
  <line x1="145" y1="508" x2="145" y2="530"/>
</g>
<!-- Point of no return after the purge entry -->
<line x1="20" y1="392" x2="292" y2="392" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="302" y="388" font-size="12.5" font-weight="bold" fill="#B91C1C">Punkt ohne Rückkehr</text>
<text x="302" y="404" font-size="12" fill="#0F172A">Ab hier nur noch <tspan font-family="Courier, monospace">--resume</tspan>.</text>
<!-- Before the journal -->
<g font-size="12" fill="#0F172A">
  <text x="302" y="44">Abbruch vor dem Journal: Es gibt</text>
  <text x="302" y="59">nichts fortzusetzen, der Purge lässt</text>
  <text x="302" y="74">sich wiederholen.</text>
</g>
<!-- Brackets: where abort and resume work -->
<g stroke="#64748B" stroke-width="1.5" fill="none">
  <path d="M296,148 L302,148 L302,380 L296,380"/>
  <path d="M296,420 L302,420 L302,572 L296,572"/>
</g>
<g font-size="12" fill="#0F172A">
  <text x="312" y="200">Das Journal besteht, jeder andere</text>
  <text x="312" y="215">Befehl, der schreibt, lehnt ab.</text>
  <text x="312" y="245"><tspan font-family="Courier, monospace" font-weight="bold">--abort</tspan> entfernt die neuen Objekte</text>
  <text x="312" y="260">und das Journal, solange der Eintrag</text>
  <text x="312" y="275">fehlt.</text>
  <text x="312" y="305"><tspan font-family="Courier, monospace" font-weight="bold">--resume</tspan> wiederholt die Schritte</text>
  <text x="312" y="320">ab den neuen Objekten.</text>
  <text x="312" y="480"><tspan font-family="Courier, monospace" font-weight="bold">--resume</tspan> findet den Eintrag und</text>
  <text x="312" y="495">beendet den Purge; <tspan font-family="Courier, monospace">--abort</tspan> lehnt ab.</text>
</g>
</svg>
