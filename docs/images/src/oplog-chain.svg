<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 316" font-family="Helvetica, Arial, sans-serif">
<title>Hash-Kette des Operation Log mit Stub, oplog-tip und Anker</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#6B46C1"/>
  </marker>
  <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
  </marker>
</defs>
<rect x="0" y="0" width="600" height="316" fill="#FFFFFF"/>
<text x="10" y="22" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#6B46C1">.stemma/oplog/</text>
<!-- Entries -->
<g stroke="#6B46C1" stroke-width="1.5" fill="#FFFFFF">
  <rect x="10" y="32" width="130" height="140" rx="4"/>
  <rect x="160" y="32" width="130" height="140" rx="4"/>
  <rect x="310" y="32" width="130" height="140" rx="4" stroke-dasharray="5 3"/>
  <rect x="460" y="32" width="130" height="140" rx="4"/>
</g>
<g stroke="#6B46C1" stroke-width="1">
  <line x1="10" y1="144" x2="140" y2="144"/>
  <line x1="160" y1="144" x2="290" y2="144"/>
  <line x1="310" y1="144" x2="440" y2="144"/>
  <line x1="460" y1="144" x2="590" y2="144"/>
</g>
<g font-size="12.5" font-weight="bold" fill="#6B46C1">
  <text x="20" y="52">Eintrag 1</text>
  <text x="170" y="52">Eintrag 2</text>
  <text x="320" y="52">Eintrag 3 (Stub)</text>
  <text x="470" y="52">Eintrag 4</text>
</g>
<g font-family="Courier, monospace" font-size="11" fill="#0F172A">
  <text x="20" y="74">number 1</text>
  <text x="20" y="90">operation init</text>
  <text x="20" y="106" fill="#64748B" font-size="10">head - branch:main</text>
  <text x="20" y="132">previous -</text>
  <text x="170" y="74">number 2</text>
  <text x="170" y="90">operation track</text>
  <text x="170" y="106" fill="#64748B">working-copy …</text>
  <text x="170" y="132">previous b3:41d0…</text>
  <text x="320" y="74">number 3</text>
  <text x="320" y="90">stub b3:c25f…</text>
  <text x="320" y="132">previous b3:9a7e…</text>
  <text x="470" y="74">number 4</text>
  <text x="470" y="90">operation purge</text>
  <text x="470" y="106" fill="#64748B">stubs 3</text>
  <text x="470" y="132">previous b3:e81b…</text>
</g>
<g font-size="12" font-weight="bold" fill="#6B46C1">
  <text x="20" y="163">Hash <tspan font-family="Courier, monospace">b3:41d0…</tspan></text>
  <text x="170" y="163">Hash <tspan font-family="Courier, monospace">b3:9a7e…</tspan></text>
  <text x="320" y="163">Hash <tspan font-family="Courier, monospace">b3:e81b…</tspan></text>
  <text x="470" y="163">Hash <tspan font-family="Courier, monospace">b3:7c3d…</tspan></text>
</g>
<!-- previous names the hash of the entry before -->
<g stroke="#6B46C1" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
  <path d="M160,128 C150,128 150,159 142,159"/>
  <path d="M310,128 C300,128 300,159 292,159"/>
  <path d="M460,128 C450,128 450,159 442,159"/>
</g>
<!-- Tip file and anchor -->
<rect x="460" y="212" width="130" height="66" rx="4" fill="#FFFFFF" stroke="#6B46C1" stroke-width="1.5"/>
<text x="470" y="232" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#6B46C1">oplog-tip</text>
<g font-family="Courier, monospace" font-size="11" fill="#0F172A">
  <text x="470" y="250">number 4</text>
  <text x="470" y="266">hash b3:7c3d…</text>
</g>
<path d="M525,212 L525,174" stroke="#6B46C1" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="310" y="212" width="130" height="66" rx="4" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="320" y="232" font-size="12" font-weight="bold" fill="#64748B">Anker</text>
<g font-size="11" fill="#0F172A">
  <text x="320" y="250" font-family="Courier, monospace">4:b3:7c3d…</text>
  <text x="320" y="266" fill="#64748B">ausserhalb des Repos</text>
</g>
<path d="M440,228 C470,228 480,200 505,175" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-grey)"/>
<text x="375" y="298" font-size="11" fill="#64748B" text-anchor="middle">
  <tspan font-family="Courier, monospace">op verify --anchor</tspan> vergleicht</text>
<!-- Explanation -->
<g font-size="12" fill="#0F172A">
  <text x="10" y="200">Hash: BLAKE3 über Nummer, Zeit,</text>
  <text x="10" y="216">Akteur, <tspan font-family="Courier, monospace">previous</tspan> und den Hash</text>
  <text x="10" y="232">des Rumpfs.</text>
  <text x="10" y="258">Der Stub behält den Hash des</text>
  <text x="10" y="274">Rumpfs, den er ersetzt. Sein Hash</text>
  <text x="10" y="290">bleibt <tspan font-family="Courier, monospace">b3:e81b…</tspan>, die Kette hält.</text>
</g>
</svg>
