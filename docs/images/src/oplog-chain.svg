<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 336" font-family="Helvetica, Arial, sans-serif">
<title>Hash-Kette des Operation Log mit Stub, oplog-tip und Anker</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#6B46C1"/>
  </marker>
  <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
  </marker>
</defs>
<rect x="0" y="0" width="600" height="336" fill="#FFFFFF"/>
<text x="10" y="22" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#6B46C1">.stemma/oplog/</text>
<!-- Entries -->
<g stroke="#6B46C1" stroke-width="1.5" fill="#FFFFFF">
  <rect x="10" y="32" width="130" height="156" rx="4"/>
  <rect x="160" y="32" width="130" height="156" rx="4"/>
  <rect x="310" y="32" width="130" height="156" rx="4" stroke-dasharray="5 3"/>
  <rect x="460" y="32" width="130" height="156" rx="4"/>
</g>
<g stroke="#6B46C1" stroke-width="1">
  <line x1="10" y1="160" x2="140" y2="160"/>
  <line x1="160" y1="160" x2="290" y2="160"/>
  <line x1="310" y1="160" x2="440" y2="160"/>
  <line x1="460" y1="160" x2="590" y2="160"/>
</g>
<g font-size="12.5" font-weight="bold" fill="#6B46C1">
  <text x="20" y="52">Eintrag 1</text>
  <text x="170" y="52">Eintrag 2</text>
  <text x="320" y="52">Eintrag 3 (Stub)</text>
  <text x="470" y="52">Eintrag 4</text>
</g>
<g font-family="Courier, monospace" font-size="11" fill="#0F172A">
  <text x="20" y="74">number 1</text>
  <text x="20" y="90">previous -</text>
  <text x="20" y="112">operation init</text>
  <text x="20" y="128" fill="#64748B">head …</text>
  <text x="20" y="144" fill="#64748B">working-copy …</text>
  <text x="170" y="74">number 2</text>
  <text x="170" y="90">previous b3:41d0…</text>
  <text x="170" y="112">operation track</text>
  <text x="170" y="128" fill="#64748B">working-copy …</text>
  <text x="320" y="74">number 3</text>
  <text x="320" y="90">previous b3:9a7e…</text>
  <text x="320" y="112">stub b3:c25f…</text>
  <text x="470" y="74">number 4</text>
  <text x="470" y="90">previous b3:e81b…</text>
  <text x="470" y="112">operation purge</text>
  <text x="470" y="128" fill="#64748B">commits …</text>
  <text x="470" y="144" fill="#64748B">stubs 3</text>
</g>
<!-- Separator between the envelope and the body -->
<g stroke="#64748B" stroke-width="0.75" stroke-dasharray="2 2">
  <line x1="18" y1="99" x2="132" y2="99"/>
  <line x1="168" y1="99" x2="282" y2="99"/>
  <line x1="318" y1="99" x2="432" y2="99"/>
  <line x1="468" y1="99" x2="582" y2="99"/>
</g>
<g font-size="12" font-weight="bold" fill="#6B46C1">
  <text x="20" y="179">Hash <tspan font-family="Courier, monospace">b3:41d0…</tspan></text>
  <text x="170" y="179">Hash <tspan font-family="Courier, monospace">b3:9a7e…</tspan></text>
  <text x="320" y="179">Hash <tspan font-family="Courier, monospace">b3:e81b…</tspan></text>
  <text x="470" y="179">Hash <tspan font-family="Courier, monospace">b3:7c3d…</tspan></text>
</g>
<!-- previous names the hash of the entry before -->
<g stroke="#6B46C1" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
  <path d="M160,86 C148,86 152,175 142,175"/>
  <path d="M310,86 C298,86 302,175 292,175"/>
  <path d="M460,86 C448,86 452,175 442,175"/>
</g>
<!-- Tip file and anchor -->
<rect x="460" y="232" width="130" height="66" rx="4" fill="#FFFFFF" stroke="#6B46C1" stroke-width="1.5"/>
<text x="470" y="252" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#6B46C1">oplog-tip</text>
<g font-family="Courier, monospace" font-size="11" fill="#0F172A">
  <text x="470" y="270">number 4</text>
  <text x="470" y="286">hash b3:7c3d…</text>
</g>
<path d="M525,232 L525,190" stroke="#6B46C1" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="310" y="232" width="130" height="66" rx="4" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="320" y="252" font-size="12" font-weight="bold" fill="#64748B">Anker</text>
<g font-size="11" fill="#0F172A">
  <text x="320" y="270" font-family="Courier, monospace">4:b3:7c3d…</text>
  <text x="320" y="286" fill="#64748B">ausserhalb des Repos</text>
</g>
<path d="M440,248 C470,248 480,230 505,191" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-grey)"/>
<text x="375" y="318" font-size="11" fill="#64748B" text-anchor="middle">
  <tspan font-family="Courier, monospace">op verify --anchor</tspan> vergleicht</text>
<!-- Explanation -->
<g font-size="12" fill="#0F172A">
  <text x="10" y="220">Hash: BLAKE3 über Nummer, Zeit,</text>
  <text x="10" y="236">Akteur, <tspan font-family="Courier, monospace">previous</tspan> und den Hash</text>
  <text x="10" y="252">des Rumpfs.</text>
  <text x="10" y="278">Der Stub behält den Hash des</text>
  <text x="10" y="294">Rumpfs, den er ersetzt. Sein Hash</text>
  <text x="10" y="310">bleibt <tspan font-family="Courier, monospace">b3:e81b…</tspan>, die Kette hält.</text>
</g>
</svg>
