<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F172A"/>
    </marker>
  </defs>
  <title>Nachbearbeitung der Grenzen: vorher und nachher</title>
  <rect x="0" y="0" width="700" height="380" fill="#FFFFFF"/>
  <text x="24" y="28" font-size="12" fill="#64748B">Dieselben vier Einfügungen (grau hinterlegt); nur die Grenze der Gruppe rückt.</text>
  <text x="24" y="62" font-size="13" font-weight="bold" fill="#0F172A">Vor der Nachbearbeitung</text>
  <text x="24" y="80" font-size="12" fill="#64748B">Die Gruppe beginnt mit der Zeile }</text>
  <rect x="24" y="96" width="300" height="201" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  <text xml:space="preserve" x="34" y="117" font-family="Courier, monospace" font-size="14" fill="#0F172A"> fn a() {</text>
  <text xml:space="preserve" x="34" y="138" font-family="Courier, monospace" font-size="14" fill="#0F172A">     x();</text>
  <rect x="24" y="144" width="300" height="21" fill="#64748B" fill-opacity="0.18"/>
  <text xml:space="preserve" x="34" y="159" font-family="Courier, monospace" font-size="14" fill="#0F172A">+}</text>
  <rect x="24" y="165" width="300" height="21" fill="#64748B" fill-opacity="0.18"/>
  <text xml:space="preserve" x="34" y="180" font-family="Courier, monospace" font-size="14" fill="#0F172A">+</text>
  <rect x="24" y="186" width="300" height="21" fill="#64748B" fill-opacity="0.18"/>
  <text xml:space="preserve" x="34" y="201" font-family="Courier, monospace" font-size="14" fill="#0F172A">+fn b() {</text>
  <rect x="24" y="207" width="300" height="21" fill="#64748B" fill-opacity="0.18"/>
  <text xml:space="preserve" x="34" y="222" font-family="Courier, monospace" font-size="14" fill="#0F172A">+    y();</text>
  <text xml:space="preserve" x="34" y="243" font-family="Courier, monospace" font-size="14" fill="#0F172A"> }</text>
  <text xml:space="preserve" x="34" y="264" font-family="Courier, monospace" font-size="14" fill="#0F172A"> </text>
  <text xml:space="preserve" x="34" y="285" font-family="Courier, monospace" font-size="14" fill="#0F172A"> fn c() {</text>
  <line x1="24" y1="144" x2="324" y2="144" stroke="#0F172A" stroke-width="2.5"/>
  <line x1="24" y1="228" x2="324" y2="228" stroke="#0F172A" stroke-width="2.5"/>
  <text x="376" y="62" font-size="13" font-weight="bold" fill="#0F172A">Nach der Nachbearbeitung</text>
  <text x="376" y="80" font-size="12" fill="#64748B">Die Gruppe ist die ganze Funktion b</text>
  <rect x="376" y="96" width="300" height="201" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  <text xml:space="preserve" x="386" y="117" font-family="Courier, monospace" font-size="14" fill="#0F172A"> fn a() {</text>
  <text xml:space="preserve" x="386" y="138" font-family="Courier, monospace" font-size="14" fill="#0F172A">     x();</text>
  <text xml:space="preserve" x="386" y="159" font-family="Courier, monospace" font-size="14" fill="#0F172A"> }</text>
  <text xml:space="preserve" x="386" y="180" font-family="Courier, monospace" font-size="14" fill="#0F172A"> </text>
  <rect x="376" y="186" width="300" height="21" fill="#64748B" fill-opacity="0.18"/>
  <text xml:space="preserve" x="386" y="201" font-family="Courier, monospace" font-size="14" fill="#0F172A">+fn b() {</text>
  <rect x="376" y="207" width="300" height="21" fill="#64748B" fill-opacity="0.18"/>
  <text xml:space="preserve" x="386" y="222" font-family="Courier, monospace" font-size="14" fill="#0F172A">+    y();</text>
  <rect x="376" y="228" width="300" height="21" fill="#64748B" fill-opacity="0.18"/>
  <text xml:space="preserve" x="386" y="243" font-family="Courier, monospace" font-size="14" fill="#0F172A">+}</text>
  <rect x="376" y="249" width="300" height="21" fill="#64748B" fill-opacity="0.18"/>
  <text xml:space="preserve" x="386" y="264" font-family="Courier, monospace" font-size="14" fill="#0F172A">+</text>
  <text xml:space="preserve" x="386" y="285" font-family="Courier, monospace" font-size="14" fill="#0F172A"> fn c() {</text>
  <line x1="376" y1="186" x2="676" y2="186" stroke="#0F172A" stroke-width="2.5"/>
  <line x1="376" y1="270" x2="676" y2="270" stroke="#0F172A" stroke-width="2.5"/>
  <line x1="332" y1="190" x2="370" y2="190" stroke="#0F172A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="351" y="180" font-size="11" fill="#0F172A" text-anchor="middle">gleitet</text>
  <text x="351" y="212" font-size="11" fill="#0F172A" text-anchor="middle">um 2</text>
  <g font-size="12" fill="#0F172A">
    <text x="24" y="332">Die Gruppe darf nach unten gleiten, solange die Zeile unter ihr der Zeile an ihrem Anfang gleicht:</text>
    <text x="24" y="348">Beginnen kann sie bei }, bei der Leerzeile oder bei fn b() {. Die Einrückung der Zeile an der Grenze</text>
    <text x="24" y="364">und die Leerzeilen davor entscheiden; hier gewinnt die Grenze nach der Leerzeile.</text>
  </g>
</svg>
