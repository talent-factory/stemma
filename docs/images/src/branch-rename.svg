<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 600" font-family="Helvetica, Arial, sans-serif">
<title>Zeiger beim Umbenennen eines Branches, mit den Zuständen nach einem Absturz</title>
<defs>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#2F7D32"/>
  </marker>
</defs>
<rect x="0" y="0" width="580" height="600" fill="#FFFFFF"/>
<text x="20" y="24" font-size="13" font-weight="bold" fill="#0F172A">Vor <tspan font-family="Courier, monospace">branch -m main trunk</tspan></text>
<rect x="450" y="40" width="110" height="70" rx="4" stroke="#64748B" stroke-width="1.5" fill="#FFFFFF"/>
<text x="460" y="62" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#0F172A">b3:2037…</text>
<text x="460" y="80" font-size="12" fill="#0F172A">Erste Fassung</text>
<rect x="20" y="64" width="50" height="20" rx="3" stroke="#2F7D32" stroke-width="1.5" fill="#FFFFFF"/>
<text x="45" y="78" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#2F7D32" text-anchor="middle">HEAD</text>
<rect x="190" y="44" width="70" height="20" rx="3" stroke="#2F7D32" stroke-width="1.5" fill="#FFFFFF"/>
<text x="225" y="58" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#2F7D32" text-anchor="middle">main</text>
<line x1="260" y1="54" x2="448" y2="70" stroke="#2F7D32" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<line x1="70" y1="74" x2="188" y2="54" stroke="#2F7D32" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<line x1="20" y1="151" x2="560" y2="151" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="20" y="169" font-size="13" font-weight="bold" fill="#B91C1C">Nach Schritt 1: <tspan font-family="Courier, monospace">trunk</tspan> angelegt</text>
<rect x="450" y="185" width="110" height="70" rx="4" stroke="#64748B" stroke-width="1.5" fill="#FFFFFF"/>
<text x="460" y="207" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#0F172A">b3:2037…</text>
<text x="460" y="225" font-size="12" fill="#0F172A">Erste Fassung</text>
<rect x="20" y="209" width="50" height="20" rx="3" stroke="#2F7D32" stroke-width="1.5" fill="#FFFFFF"/>
<text x="45" y="223" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#2F7D32" text-anchor="middle">HEAD</text>
<rect x="190" y="189" width="70" height="20" rx="3" stroke="#2F7D32" stroke-width="1.5" fill="#FFFFFF"/>
<text x="225" y="203" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#2F7D32" text-anchor="middle">main</text>
<line x1="260" y1="199" x2="448" y2="215" stroke="#2F7D32" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<rect x="190" y="229" width="70" height="20" rx="3" stroke="#2F7D32" stroke-width="1.5" fill="#FFFFFF"/>
<text x="225" y="243" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#2F7D32" text-anchor="middle">trunk</text>
<line x1="260" y1="239" x2="448" y2="227" stroke="#2F7D32" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<line x1="70" y1="219" x2="188" y2="199" stroke="#2F7D32" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<text x="20" y="277" font-size="12" fill="#B91C1C">Absturz hier: der Commit liegt unter beiden Namen, HEAD nennt noch main.</text>
<line x1="20" y1="296" x2="560" y2="296" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="20" y="314" font-size="13" font-weight="bold" fill="#B91C1C">Nach Schritt 2: HEAD folgt</text>
<rect x="450" y="330" width="110" height="70" rx="4" stroke="#64748B" stroke-width="1.5" fill="#FFFFFF"/>
<text x="460" y="352" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#0F172A">b3:2037…</text>
<text x="460" y="370" font-size="12" fill="#0F172A">Erste Fassung</text>
<rect x="20" y="354" width="50" height="20" rx="3" stroke="#2F7D32" stroke-width="1.5" fill="#FFFFFF"/>
<text x="45" y="368" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#2F7D32" text-anchor="middle">HEAD</text>
<rect x="190" y="334" width="70" height="20" rx="3" stroke="#2F7D32" stroke-width="1.5" fill="#FFFFFF"/>
<text x="225" y="348" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#2F7D32" text-anchor="middle">main</text>
<line x1="260" y1="344" x2="448" y2="360" stroke="#2F7D32" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<rect x="190" y="374" width="70" height="20" rx="3" stroke="#2F7D32" stroke-width="1.5" fill="#FFFFFF"/>
<text x="225" y="388" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#2F7D32" text-anchor="middle">trunk</text>
<line x1="260" y1="384" x2="448" y2="372" stroke="#2F7D32" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<line x1="70" y1="364" x2="188" y2="384" stroke="#2F7D32" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<text x="20" y="422" font-size="12" fill="#B91C1C">Absturz hier: HEAD nennt trunk, main besteht noch.</text>
<line x1="20" y1="441" x2="560" y2="441" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="20" y="459" font-size="13" font-weight="bold" fill="#0F172A">Nach Schritt 3: <tspan font-family="Courier, monospace">main</tspan> gelöscht</text>
<rect x="450" y="475" width="110" height="70" rx="4" stroke="#64748B" stroke-width="1.5" fill="#FFFFFF"/>
<text x="460" y="497" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#0F172A">b3:2037…</text>
<text x="460" y="515" font-size="12" fill="#0F172A">Erste Fassung</text>
<rect x="20" y="499" width="50" height="20" rx="3" stroke="#2F7D32" stroke-width="1.5" fill="#FFFFFF"/>
<text x="45" y="513" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#2F7D32" text-anchor="middle">HEAD</text>
<rect x="190" y="519" width="70" height="20" rx="3" stroke="#2F7D32" stroke-width="1.5" fill="#FFFFFF"/>
<text x="225" y="533" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#2F7D32" text-anchor="middle">trunk</text>
<line x1="260" y1="529" x2="448" y2="517" stroke="#2F7D32" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<line x1="70" y1="509" x2="188" y2="529" stroke="#2F7D32" stroke-width="1.5" marker-end="url(#arrow-green)"/>
</svg>
