<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 352" font-family="Helvetica, Arial, sans-serif">
<title>Änderungen ansehen als Zeitachse</title>
<rect x="0" y="0" width="700" height="352" fill="#FFFFFF"/>
<!-- Column headers: one colour per zone, as in commands.svg -->
<g font-size="12" font-weight="bold">
  <text x="20" y="43" fill="#0F172A">Befehl</text>
  <text x="236" y="28" fill="#6B46C1">Eintrag und</text>
  <text x="236" y="43" fill="#6B46C1">Operation</text>
  <text x="328" y="28" fill="#B45309">Working-Copy-</text>
  <text x="328" y="43" fill="#B45309">Commit</text>
  <text x="434" y="43" fill="#2F7D32">main</text>
  <text x="526" y="43" fill="#2B6CB0">Verzeichnis</text>
</g>
<line x1="10" y1="62" x2="690" y2="62" stroke="#0F172A" stroke-width="2"/>
<!-- Row separators -->
<g stroke="#64748B" stroke-width="1">
  <line x1="10" y1="102" x2="690" y2="102"/>
  <line x1="10" y1="142" x2="690" y2="142"/>
  <line x1="10" y1="182" x2="690" y2="182"/>
  <line x1="10" y1="222" x2="690" y2="222"/>
  <line x1="10" y1="262" x2="690" y2="262"/>
</g>
<!-- Rows: the value after the command; bold in the colour of the zone when the command changed it -->
<text x="20" y="90" font-family="Courier, monospace" font-size="12" fill="#0F172A">commit -m &quot;Anfang&quot;</text>
<text x="236" y="90" font-size="12" fill="#6B46C1"><tspan font-weight="bold">3</tspan> <tspan font-family="Courier, monospace">commit</tspan></text>
<text x="328" y="90" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#B45309">b3:367a…</text>
<text x="434" y="90" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#2F7D32">b3:698e…</text>
<text x="526" y="90" font-size="12" fill="#64748B">–</text>
<text x="20" y="130" font-family="Courier, monospace" font-size="12" fill="#0F172A">diff</text>
<text x="236" y="130" font-size="12" fill="#6B46C1"><tspan font-weight="bold">4</tspan> <tspan font-family="Courier, monospace">snapshot</tspan></text>
<text x="328" y="130" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#B45309">b3:ed40…</text>
<text x="434" y="130" font-family="Courier, monospace" font-size="12" fill="#64748B">b3:698e…</text>
<text x="526" y="119" font-size="11" fill="#2B6CB0">liest notes.txt, von Hand</text>
<text x="526" y="134" font-size="11" fill="#2B6CB0">geändert</text>
<text x="20" y="170" font-family="Courier, monospace" font-size="12" fill="#0F172A">diff --exit-code</text>
<text x="236" y="159" font-size="11" font-style="italic" fill="#64748B">kein Eintrag,</text>
<text x="236" y="174" font-size="11" font-style="italic" fill="#64748B">Exit-Code 4</text>
<text x="328" y="170" font-family="Courier, monospace" font-size="12" fill="#64748B">b3:ed40…</text>
<text x="434" y="170" font-family="Courier, monospace" font-size="12" fill="#64748B">b3:698e…</text>
<text x="526" y="159" font-size="11" fill="#2B6CB0">liest notes.txt, Baum</text>
<text x="526" y="174" font-size="11" fill="#2B6CB0">unverändert</text>
<text x="20" y="210" font-family="Courier, monospace" font-size="12" fill="#0F172A">commit -m &quot;Zweite Zeile&quot;</text>
<text x="236" y="210" font-size="12" fill="#6B46C1"><tspan font-weight="bold">5</tspan> <tspan font-family="Courier, monospace">commit</tspan></text>
<text x="328" y="210" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#B45309">b3:0dac…</text>
<text x="434" y="210" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#2F7D32">b3:1916…</text>
<text x="526" y="210" font-size="12" fill="#64748B">–</text>
<text x="20" y="250" font-family="Courier, monospace" font-size="12" fill="#0F172A">diff b3:698e… b3:1916…</text>
<text x="236" y="250" font-size="11" font-style="italic" fill="#64748B">kein Eintrag</text>
<text x="328" y="250" font-family="Courier, monospace" font-size="12" fill="#64748B">b3:0dac…</text>
<text x="434" y="250" font-family="Courier, monospace" font-size="12" fill="#64748B">b3:1916…</text>
<text x="526" y="250" font-size="12" fill="#64748B">–</text>
<!-- Explanation -->
<g font-size="12" fill="#0F172A">
  <text x="20" y="284">Jede Zeile nennt die Werte nach dem Befehl. Fett: vom Befehl geändert; grau: unverändert.</text>
  <text x="20" y="300">Zeile 2: Mit dem Working-Copy-Commit als einer Seite macht der Befehl zuerst einen Snapshot.</text>
  <text x="20" y="316">Zeile 3: Ist der Baum unverändert, entsteht kein Eintrag; die Ausgabe ist dieselbe.</text>
  <text x="20" y="332">Zeile 5: Bei zwei Commits liest der Befehl nur Objekte; er ändert weder Zeiger noch Log.</text>
</g>
</svg>
