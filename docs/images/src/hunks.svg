<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 346" font-family="Helvetica, Arial, sans-serif">
  <title>Gruppierung des Skripts in Hunks mit c = 3</title>
  <rect x="0" y="0" width="700" height="346" fill="#FFFFFF"/>
  <text x="24" y="24" font-size="12" font-weight="bold" fill="#0F172A">Schritte des Skripts</text>
  <text x="24" y="42" font-size="12" fill="#64748B">Kontext c = 3: Das Fenster einer Änderung reicht 3 Schritte nach beiden Seiten.</text>
  <!-- Steps of the script -->
  <rect x="24" y="78" width="29" height="28" fill="#FFFFFF" stroke="#64748B" stroke-width="1"/>
  <rect x="53" y="78" width="29" height="28" fill="#FFFFFF" stroke="#64748B" stroke-width="1"/>
  <rect x="82" y="78" width="29" height="28" fill="#FFFFFF" stroke="#64748B" stroke-width="1"/>
  <rect x="111" y="78" width="29" height="28" fill="#0F172A" stroke="#0F172A" stroke-width="1"/>
  <text x="125" y="97" font-family="Courier, monospace" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">−</text>
  <rect x="140" y="78" width="29" height="28" fill="#FFFFFF" stroke="#64748B" stroke-width="1"/>
  <rect x="169" y="78" width="29" height="28" fill="#FFFFFF" stroke="#64748B" stroke-width="1"/>
  <rect x="198" y="78" width="29" height="28" fill="#FFFFFF" stroke="#64748B" stroke-width="1"/>
  <rect x="227" y="78" width="29" height="28" fill="#FFFFFF" stroke="#64748B" stroke-width="1"/>
  <rect x="256" y="78" width="29" height="28" fill="#FFFFFF" stroke="#64748B" stroke-width="1"/>
  <rect x="285" y="78" width="29" height="28" fill="#0F172A" stroke="#0F172A" stroke-width="1"/>
  <text x="299" y="97" font-family="Courier, monospace" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">+</text>
  <rect x="314" y="78" width="29" height="28" fill="#FFFFFF" stroke="#64748B" stroke-width="1"/>
  <rect x="343" y="78" width="29" height="28" fill="#FFFFFF" stroke="#64748B" stroke-width="1"/>
  <rect x="372" y="78" width="29" height="28" fill="#FFFFFF" stroke="#64748B" stroke-width="1"/>
  <rect x="401" y="78" width="29" height="28" fill="#FFFFFF" stroke="#64748B" stroke-width="1"/>
  <rect x="430" y="78" width="29" height="28" fill="#FFFFFF" stroke="#64748B" stroke-width="1"/>
  <rect x="459" y="78" width="29" height="28" fill="#FFFFFF" stroke="#64748B" stroke-width="1"/>
  <rect x="488" y="78" width="29" height="28" fill="#FFFFFF" stroke="#64748B" stroke-width="1"/>
  <rect x="517" y="78" width="29" height="28" fill="#0F172A" stroke="#0F172A" stroke-width="1"/>
  <text x="531" y="97" font-family="Courier, monospace" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">−</text>
  <rect x="546" y="78" width="29" height="28" fill="#FFFFFF" stroke="#64748B" stroke-width="1"/>
  <rect x="575" y="78" width="29" height="28" fill="#FFFFFF" stroke="#64748B" stroke-width="1"/>
  <rect x="604" y="78" width="29" height="28" fill="#FFFFFF" stroke="#64748B" stroke-width="1"/>
  <rect x="633" y="78" width="29" height="28" fill="#FFFFFF" stroke="#64748B" stroke-width="1"/>
  <g font-size="10" fill="#64748B" text-anchor="middle">
    <text x="38" y="72">0</text>
    <text x="67" y="72">1</text>
    <text x="96" y="72">2</text>
    <text x="125" y="72">3</text>
    <text x="154" y="72">4</text>
    <text x="183" y="72">5</text>
    <text x="212" y="72">6</text>
    <text x="241" y="72">7</text>
    <text x="270" y="72">8</text>
    <text x="299" y="72">9</text>
    <text x="328" y="72">10</text>
    <text x="357" y="72">11</text>
    <text x="386" y="72">12</text>
    <text x="415" y="72">13</text>
    <text x="444" y="72">14</text>
    <text x="473" y="72">15</text>
    <text x="502" y="72">16</text>
    <text x="531" y="72">17</text>
    <text x="560" y="72">18</text>
    <text x="589" y="72">19</text>
    <text x="618" y="72">20</text>
    <text x="647" y="72">21</text>
  </g>
  <!-- Windows of the changes (bracket lines below the steps) -->
  <g fill="none" stroke="#64748B" stroke-width="2">
    <path d="M26,115 V120 H225 V115"/>
    <path d="M200,129 V134 H399 V129"/>
    <path d="M432,115 V120 H631 V115"/>
  </g>
  <g font-size="11" fill="#64748B">
    <text x="24" y="158">Klammern: Fenster der Änderungen 3, 9 und 17.</text>
    <text x="24" y="174">Gestrichelt: Schritt 6 liegt in zwei Fenstern.</text>
  </g>
  <!-- The windows of 3 and 9 share step 6 and merge -->
  <rect x="197" y="75" width="31" height="34" fill="none" stroke="#0F172A" stroke-width="1.5" stroke-dasharray="3 3"/>
  <!-- Hunks -->
  <rect x="24" y="192" width="377" height="26" rx="4" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
  <text x="212" y="210" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">Hunk 1</text>
  <rect x="430" y="192" width="203" height="26" rx="4" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
  <text x="531" y="210" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">Hunk 2</text>
  <!-- Steps outside every window: not shown -->
  <line x1="415" y1="108" x2="415" y2="218" stroke="#64748B" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="647" y1="108" x2="647" y2="218" stroke="#64748B" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="415" y="236" font-size="11" fill="#64748B" text-anchor="middle">in keinem Fenster:</text>
  <text x="421" y="250" font-size="11" fill="#64748B" text-anchor="middle">Schritt 13, nicht angezeigt</text>
  <text x="662" y="236" font-size="11" fill="#64748B" text-anchor="end">Schritt 21</text>
  <!-- Rule -->
  <g font-size="12" fill="#0F172A">
    <text x="24" y="278" font-weight="bold">Regel</text>
    <text x="24" y="296">Zwischen den Änderungen 3 und 9 liegen 5 unveränderte Schritte, und 5 ≤ 2c = 6: Die Fenster</text>
    <text x="24" y="312">überlappen, es entsteht ein Hunk. Zwischen 9 und 17 liegen 7 &gt; 6: Die Fenster berühren sich</text>
    <text x="24" y="328">nicht, es beginnt ein neuer Hunk. Ein Hunk entsteht aus einer Kette von Nachbarn.</text>
  </g>
</svg>
