<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Helvetica, Arial, sans-serif">
<title>Die Sitzung der Phase 3: Daniel und der Agent</title>
<defs>
  <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F7D32"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2B6CB0"/></marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker>
  <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B46C1"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker>
</defs>
<rect x="0" y="0" width="720" height="420" fill="#FFFFFF"/>
<text x="300" y="24" font-size="12" font-weight="bold" text-anchor="middle" fill="#2B6CB0">Daniel</text>
<text x="300" y="38" font-size="11" text-anchor="middle" fill="#64748B">Wurzel, Branch main</text>
<text x="470" y="24" font-size="12" font-weight="bold" text-anchor="middle" fill="#2F7D32">Agent</text>
<text x="470" y="38" font-size="11" text-anchor="middle" fill="#64748B">Worktree notizen-agent, Branch agent-arbeit</text>
<text x="20" y="38" font-size="11" font-weight="bold" fill="#6B46C1">Eintrag im Log</text>
<line x1="300" y1="48" x2="300" y2="368" stroke="#E2E8F0" stroke-width="2"/>
<line x1="470" y1="48" x2="470" y2="368" stroke="#E2E8F0" stroke-width="2"/>
<text x="20" y="74" font-size="12" font-family="Courier, monospace" font-weight="bold" fill="#6B46C1">6</text>
<circle cx="300" cy="70" r="7" stroke="#6B46C1" stroke-width="1.5" fill="#FFFFFF"/>
<text x="284" y="68" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="end" fill="#2B6CB0">worktree add</text>
<text x="284" y="82" font-size="11" text-anchor="end" fill="#64748B">legt den Worktree und agent-arbeit an</text>
<text x="20" y="116" font-size="12" font-family="Courier, monospace" font-weight="bold" fill="#6B46C1">7, 8</text>
<circle cx="470" cy="112" r="7" stroke="#6B46C1" stroke-width="1.5" fill="#FFFFFF"/>
<text x="486" y="110" font-size="12" font-family="Courier, monospace" font-weight="bold" fill="#2F7D32">track, commit</text>
<text x="486" y="124" font-size="11" fill="#64748B">Agent: Gruss und Bibliothek</text>
<text x="20" y="158" font-size="12" font-family="Courier, monospace" font-weight="bold" fill="#6B46C1">9, 10</text>
<circle cx="300" cy="154" r="7" stroke="#6B46C1" stroke-width="1.5" fill="#FFFFFF"/>
<text x="284" y="152" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="end" fill="#2B6CB0">commit</text>
<text x="284" y="166" font-size="11" text-anchor="end" fill="#64748B">Ausrufezeichen</text>
<text x="20" y="200" font-size="12" font-family="Courier, monospace" font-weight="bold" fill="#6B46C1">11</text>
<circle cx="300" cy="196" r="7" stroke="#6B46C1" stroke-width="1.5" fill="#FFFFFF"/>
<text x="284" y="194" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="end" fill="#2B6CB0">merge agent-arbeit</text>
<text x="284" y="208" font-size="11" text-anchor="end" fill="#64748B">Merge-Commit mit Konflikt in README.md</text>
<text x="20" y="242" font-size="12" font-family="Courier, monospace" font-weight="bold" fill="#6B46C1">12, 13</text>
<circle cx="300" cy="238" r="7" stroke="#6B46C1" stroke-width="1.5" fill="#FFFFFF"/>
<text x="284" y="236" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="end" fill="#2B6CB0">Konflikt lösen, commit</text>
<text x="284" y="250" font-size="11" text-anchor="end" fill="#64748B">main auf die Lösung</text>
<text x="20" y="284" font-size="12" font-family="Courier, monospace" font-weight="bold" fill="#6B46C1">14</text>
<circle cx="300" cy="280" r="7" stroke="#6B46C1" stroke-width="1.5" fill="#FFFFFF"/>
<text x="284" y="278" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="end" fill="#2B6CB0">op restore 11</text>
<text x="284" y="292" font-size="11" text-anchor="end" fill="#64748B">main und Dateien wie vor dem Merge</text>
<text x="20" y="326" font-size="12" font-family="Courier, monospace" font-weight="bold" fill="#6B46C1">15</text>
<circle cx="470" cy="322" r="7" stroke="#6B46C1" stroke-width="1.5" fill="#FFFFFF"/>
<text x="486" y="320" font-size="12" font-family="Courier, monospace" font-weight="bold" fill="#2F7D32">rebase main</text>
<text x="486" y="334" font-size="11" fill="#64748B">Konflikt als Daten</text>
<text x="20" y="368" font-size="12" font-family="Courier, monospace" font-weight="bold" fill="#6B46C1">18</text>
<circle cx="300" cy="364" r="7" stroke="#6B46C1" stroke-width="1.5" fill="#FFFFFF"/>
<text x="284" y="362" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="end" fill="#2B6CB0">merge agent-arbeit</text>
<text x="284" y="376" font-size="11" text-anchor="end" fill="#64748B">Fast-Forward von main</text>
<text x="20" y="396" font-size="11" fill="#64748B">Jeder Punkt ist ein Eintrag im Operation Log, auf der Spur des Akteurs, dessen Befehl ihn schreibt.</text>
</svg>
