<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 502" font-family="Helvetica, Arial, sans-serif">
  <title>Welcher Befehl berührt welche Zone</title>
  <rect x="0" y="0" width="740" height="502" fill="#FFFFFF"/>

  <!-- Zone headers: one colour per zone, dark enough for print -->
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <text x="380" y="28" fill="#2B6CB0">Arbeits-</text>
    <text x="380" y="43" fill="#2B6CB0">verzeichnis</text>
    <text x="480" y="28" fill="#B45309">Working-Copy-</text>
    <text x="480" y="43" fill="#B45309">Commit</text>
    <text x="580" y="28" fill="#2F7D32">Branch und</text>
    <text x="580" y="43" fill="#2F7D32">HEAD</text>
    <text x="680" y="28" fill="#6B46C1">Operation</text>
    <text x="680" y="43" fill="#6B46C1">Log</text>
  </g>
  <text x="20" y="43" font-size="12" font-weight="bold" fill="#0F172A">Befehl</text>
  <line x1="20" y1="62" x2="730" y2="62" stroke="#0F172A" stroke-width="2"/>

  <!-- Row separators -->
  <g stroke="#64748B" stroke-width="1">
    <line x1="20" y1="106" x2="730" y2="106"/>
    <line x1="20" y1="150" x2="730" y2="150"/>
    <line x1="20" y1="194" x2="730" y2="194"/>
    <line x1="20" y1="238" x2="730" y2="238"/>
    <line x1="20" y1="282" x2="730" y2="282"/>
    <line x1="20" y1="326" x2="730" y2="326"/>
    <line x1="20" y1="370" x2="730" y2="370"/>
    <line x1="20" y1="414" x2="730" y2="414"/>
    <line x1="20" y1="458" x2="730" y2="458"/>
  </g>

  <!-- Commands -->
  <g fill="#0F172A">
    <text x="20" y="81" font-family="Courier, monospace" font-size="15" font-weight="bold">init</text>
    <text x="20" y="125" font-family="Courier, monospace" font-size="15" font-weight="bold">track</text>
    <text x="20" y="169" font-family="Courier, monospace" font-size="15" font-weight="bold">commit</text>
    <text x="20" y="213" font-family="Courier, monospace" font-size="15" font-weight="bold">status</text>
    <text x="20" y="257" font-family="Courier, monospace" font-size="15" font-weight="bold">op log</text>
    <text x="20" y="301" font-family="Courier, monospace" font-size="15" font-weight="bold">op verify</text>
    <text x="20" y="345" font-family="Courier, monospace" font-size="15" font-weight="bold">op restore</text>
    <text x="20" y="389" font-family="Courier, monospace" font-size="15" font-weight="bold">purge --apply</text>
    <text x="20" y="433" font-family="Courier, monospace" font-size="15" font-weight="bold">diff</text>
  </g>
  <g fill="#0F172A" font-size="12">
    <text x="20" y="97">legt das Repository an</text>
    <text x="20" y="141">nimmt Dateien in den Baum auf</text>
    <text x="20" y="185">benennt den Commit und beginnt einen neuen</text>
    <text x="20" y="229">zeigt A, M, D und unverfolgte Dateien</text>
    <text x="20" y="273">zeigt die Einträge, neueste zuerst</text>
    <text x="20" y="317">prüft die Hash-Kette und nennt einen Anker</text>
    <text x="20" y="361">setzt die Werte vor einem Eintrag zurück</text>
    <text x="20" y="405">entfernt ein Geheimnis aus Verlauf und Log</text>
    <text x="20" y="449">zeigt Änderungen zwischen Commits oder zur Arbeitskopie</text>
  </g>

  <!-- init: changes working-copy commit, HEAD, log -->
  <circle cx="480" cy="84" r="9" fill="#B45309"/>
  <circle cx="580" cy="84" r="9" fill="#2F7D32"/>
  <circle cx="680" cy="84" r="9" fill="#6B46C1"/>
  <text x="380" y="89" font-size="14" fill="#64748B" text-anchor="middle">–</text>

  <!-- track: reads the directory, changes working-copy commit and log -->
  <circle cx="380" cy="128" r="8" fill="none" stroke="#2B6CB0" stroke-width="2"/>
  <circle cx="480" cy="128" r="9" fill="#B45309"/>
  <text x="580" y="133" font-size="14" fill="#64748B" text-anchor="middle">–</text>
  <circle cx="680" cy="128" r="9" fill="#6B46C1"/>

  <!-- commit: reads the directory, changes working-copy commit, branch and log -->
  <circle cx="380" cy="172" r="8" fill="none" stroke="#2B6CB0" stroke-width="2"/>
  <circle cx="480" cy="172" r="9" fill="#B45309"/>
  <circle cx="580" cy="172" r="9" fill="#2F7D32"/>
  <circle cx="680" cy="172" r="9" fill="#6B46C1"/>

  <!-- status: reads; the snapshot changes pointer and log only if a tracked file changed -->
  <circle cx="380" cy="216" r="8" fill="none" stroke="#2B6CB0" stroke-width="2"/>
  <circle cx="480" cy="216" r="8" fill="none" stroke="#B45309" stroke-width="2"/>
  <path d="M480,208 A8,8 0 0 0 480,224 Z" fill="#B45309"/>
  <circle cx="580" cy="216" r="8" fill="none" stroke="#2F7D32" stroke-width="2"/>
  <circle cx="680" cy="216" r="8" fill="none" stroke="#6B46C1" stroke-width="2"/>
  <path d="M680,208 A8,8 0 0 0 680,224 Z" fill="#6B46C1"/>

  <!-- op log: only reads -->
  <text x="380" y="265" font-size="14" fill="#64748B" text-anchor="middle">–</text>
  <circle cx="480" cy="260" r="8" fill="none" stroke="#B45309" stroke-width="2"/>
  <circle cx="580" cy="260" r="8" fill="none" stroke="#2F7D32" stroke-width="2"/>
  <circle cx="680" cy="260" r="8" fill="none" stroke="#6B46C1" stroke-width="2"/>

  <!-- op verify: only reads the log -->
  <text x="380" y="309" font-size="14" fill="#64748B" text-anchor="middle">–</text>
  <text x="480" y="309" font-size="14" fill="#64748B" text-anchor="middle">–</text>
  <text x="580" y="309" font-size="14" fill="#64748B" text-anchor="middle">–</text>
  <circle cx="680" cy="304" r="8" fill="none" stroke="#6B46C1" stroke-width="2"/>

  <!-- op restore: saves and rewrites the directory, moves the pointers, writes an entry -->
  <circle cx="380" cy="348" r="9" fill="#2B6CB0"/>
  <circle cx="480" cy="348" r="9" fill="#B45309"/>
  <circle cx="580" cy="348" r="9" fill="#2F7D32"/>
  <circle cx="680" cy="348" r="9" fill="#6B46C1"/>

  <!-- purge with apply: the snapshot reads the directory; moves the pointers, rewrites the log -->
  <circle cx="380" cy="392" r="8" fill="none" stroke="#2B6CB0" stroke-width="2"/>
  <circle cx="480" cy="392" r="9" fill="#B45309"/>
  <circle cx="580" cy="392" r="9" fill="#2F7D32"/>
  <circle cx="680" cy="392" r="9" fill="#6B46C1"/>

  <!-- diff: reads the directory; with the working-copy commit as one side the snapshot changes
       the working-copy pointer and the log only if a tracked file changed, and with two commits
       nothing changes; it reads no branch and no HEAD -->
  <circle cx="380" cy="436" r="8" fill="none" stroke="#2B6CB0" stroke-width="2"/>
  <circle cx="480" cy="436" r="8" fill="none" stroke="#B45309" stroke-width="2"/>
  <path d="M480,428 A8,8 0 0 0 480,444 Z" fill="#B45309"/>
  <text x="580" y="441" font-size="14" fill="#64748B" text-anchor="middle">–</text>
  <circle cx="680" cy="436" r="8" fill="none" stroke="#6B46C1" stroke-width="2"/>
  <path d="M680,428 A8,8 0 0 0 680,444 Z" fill="#6B46C1"/>

  <!-- Legend -->
  <g fill="#0F172A" font-size="12">
    <circle cx="28" cy="481" r="8" fill="#0F172A"/>
    <text x="44" y="485">ändert</text>
    <circle cx="116" cy="481" r="7" fill="none" stroke="#0F172A" stroke-width="2"/>
    <text x="132" y="485">liest nur</text>
    <circle cx="220" cy="481" r="7" fill="none" stroke="#0F172A" stroke-width="2"/>
    <path d="M220,474 A7,7 0 0 0 220,488 Z" fill="#0F172A"/>
    <text x="236" y="485">ändert nur, wenn sich eine verfolgte Datei geändert hat</text>
    <text x="568" y="485" font-size="14" fill="#64748B">–</text>
    <text x="584" y="485">unberührt</text>
  </g>
</svg>
