<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="Helvetica, Arial, sans-serif">
<title>Zwei Arten von Konflikt am Merge-Gate: der Konflikt im Merge geht an den Autor zurück, der semantische Konflikt zeigt sich erst auf der Spitze von main</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
  </marker>
</defs>
<rect x="0" y="0" width="600" height="460" fill="#FFFFFF"/>
<!-- start -->
<rect x="150" y="14" width="300" height="46" rx="4" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
<text x="162" y="34" font-size="12.5" font-weight="bold" fill="#0F172A">Merge auf die Spitze <tspan font-family="Courier, monospace">T</tspan></text>
<text x="162" y="50" font-size="11" fill="#0F172A">Schritt 1 des Gates (ADR-019)</text>
<g stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)">
  <path d="M230 60 L230 84 L150 84 L150 108" fill="none"/>
  <path d="M370 60 L370 84 L450 84 L450 108" fill="none"/>
</g>
<!-- left column: conflict in the merge -->
<rect x="20" y="108" width="260" height="46" rx="4" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
<text x="32" y="128" font-size="12.5" font-weight="bold" fill="#0F172A">Konflikt im Merge</text>
<text x="32" y="144" font-size="11" fill="#0F172A">Der Tree-Merge liefert eine Summe.</text>
<rect x="20" y="190" width="260" height="46" rx="4" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
<text x="32" y="210" font-size="12.5" font-weight="bold" fill="#0F172A">Das Gate lehnt ab</text>
<text x="32" y="226" font-size="11" fill="#0F172A">Nichts bewegt <tspan font-family="Courier, monospace">main</tspan>.</text>
<rect x="20" y="272" width="260" height="62" rx="4" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
<text x="32" y="292" font-size="12.5" font-weight="bold" fill="#0F172A">Der Autor löst ihn</text>
<text x="32" y="308" font-size="11" fill="#0F172A"><tspan font-family="Courier, monospace">rebase</tspan> trägt den Konflikt als Daten</text>
<text x="32" y="322" font-size="11" fill="#0F172A">in den Commits; lösen, erneut pushen.</text>
<g stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)">
  <line x1="150" y1="154" x2="150" y2="188"/>
  <line x1="150" y1="236" x2="150" y2="270"/>
</g>
<path d="M20 303 L8 303 L8 37 L148 37" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<text x="150" y="358" font-size="11" fill="#0F172A" text-anchor="middle">Danach beginnt das Gate wieder bei Schritt 1.</text>
<!-- right column: clean merge -->
<rect x="320" y="108" width="260" height="46" rx="4" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
<text x="332" y="128" font-size="12.5" font-weight="bold" fill="#0F172A">Sauberer Merge</text>
<text x="332" y="142" font-size="11" fill="#0F172A">Ein Tree; daraus wird der Commit <tspan font-family="Courier, monospace">M</tspan>.</text>
<rect x="320" y="190" width="260" height="46" rx="4" fill="#FFFFFF" stroke="#2F7D32" stroke-width="1.5"/>
<text x="332" y="210" font-size="12.5" font-weight="bold" fill="#2F7D32"><tspan font-family="Courier, monospace">main</tspan> von <tspan font-family="Courier, monospace">T</tspan> auf <tspan font-family="Courier, monospace">M</tspan></text>
<text x="332" y="226" font-size="11" fill="#0F172A">Regel nach Risikostufe, Compare-and-swap.</text>
<rect x="320" y="272" width="260" height="46" rx="4" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
<text x="332" y="292" font-size="12.5" font-weight="bold" fill="#0F172A">Prüfung auf der Spitze</text>
<text x="332" y="308" font-size="11" fill="#0F172A">Ein Lauf deckt die Spitze bei seinem Start ab.</text>
<g stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)">
  <line x1="450" y1="154" x2="450" y2="188"/>
  <line x1="450" y1="236" x2="450" y2="270"/>
</g>
<!-- outcomes -->
<path d="M390 318 L390 352 L340 352 L340 374" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M510 318 L510 352 L520 352 L520 374" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="320" y="374" width="110" height="46" rx="4" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
<text x="332" y="394" font-size="12.5" font-weight="bold" fill="#0F172A">Grün</text>
<text x="332" y="410" font-size="11" fill="#0F172A">Die Spitze besteht.</text>
<rect x="440" y="374" width="150" height="72" rx="4" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
<text x="452" y="394" font-size="12.5" font-weight="bold" fill="#0F172A">Rot</text>
<text x="452" y="410" font-size="11" fill="#0F172A">Semantischer Konflikt:</text>
<text x="452" y="424" font-size="11" fill="#0F172A">eine neue Änderung</text>
<text x="452" y="438" font-size="11" fill="#0F172A">(Fix oder Revert).</text>
</svg>
