<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Helvetica, Arial, sans-serif">
<title>Criss-Cross-Merge und die flache Summe der Merge-Basen</title>
<defs>
  <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
</defs>
<rect x="0" y="0" width="720" height="380" fill="#FFFFFF"/>
<text x="20" y="24" font-size="12" font-weight="bold" fill="#0F172A">Verlauf: zwei Merge-Basen</text>
<rect x="20" y="160" width="56" height="26" rx="4" stroke="#64748B" stroke-width="1.5" fill="#FFFFFF"/>
<text x="48.0" y="177.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#0F172A">W</text>
<rect x="100" y="110" width="56" height="26" rx="4" stroke="#64748B" stroke-width="1.5" fill="#FFFFFF"/>
<text x="128.0" y="127.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#0F172A">L</text>
<rect x="100" y="210" width="56" height="26" rx="4" stroke="#64748B" stroke-width="1.5" fill="#FFFFFF"/>
<text x="128.0" y="227.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#0F172A">R</text>
<line x1="100" y1="123" x2="77" y2="168" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
<line x1="100" y1="223" x2="77" y2="178" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
<rect x="200" y="60" width="56" height="26" rx="4" stroke="#64748B" stroke-width="1.5" fill="#FFFFFF"/>
<text x="228.0" y="77.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#0F172A">O</text>
<rect x="200" y="260" width="56" height="26" rx="4" stroke="#64748B" stroke-width="1.5" fill="#FFFFFF"/>
<text x="228.0" y="277.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#0F172A">T</text>
<line x1="200" y1="73" x2="157" y2="115" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
<line x1="200" y1="80" x2="157" y2="215" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
<line x1="200" y1="273" x2="157" y2="230" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
<line x1="200" y1="266" x2="157" y2="130" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
<text x="266" y="77" font-size="12" fill="#64748B">eigene Seite</text>
<text x="266" y="277" font-size="12" fill="#64748B">andere Seite</text>
<text x="20" y="320" font-size="12" fill="#64748B">O fasst L und R zusammen, T ebenso: Beide Seiten haben L und R als beste</text>
<text x="20" y="336" font-size="12" fill="#64748B">gemeinsame Vorfahren, und keiner ist Vorfahr des anderen. W liegt unter beiden.</text>
<text x="20" y="352" font-size="12" fill="#0F172A">Summe der Basen: L + (R − W). Summe des Merges: O + T − L − R + W.</text>
<text x="345" y="24" font-size="12" font-weight="bold" fill="#0F172A">Eine Datei mit drei Zeilen, Zeile für Zeile</text>
<text x="409.0" y="58" font-size="12" font-weight="bold" text-anchor="middle" fill="#0F172A">+ W</text>
<text x="457.0" y="58" font-size="12" font-weight="bold" text-anchor="middle" fill="#0F172A">− L</text>
<text x="505.0" y="58" font-size="12" font-weight="bold" text-anchor="middle" fill="#0F172A">− R</text>
<text x="553.0" y="58" font-size="12" font-weight="bold" text-anchor="middle" fill="#0F172A">+ O</text>
<text x="601.0" y="58" font-size="12" font-weight="bold" text-anchor="middle" fill="#0F172A">+ T</text>
<text x="665" y="58" font-size="12" font-weight="bold" text-anchor="middle" fill="#0F172A">Summe</text>
<text x="345" y="89" font-size="12" fill="#64748B">Zeile 1</text>
<rect x="387" y="70" width="44" height="30" rx="4" stroke="#64748B" stroke-width="1.5" fill="#FFFFFF"/>
<text x="409.0" y="89.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#0F172A">a</text>
<rect x="435" y="70" width="44" height="30" rx="4" stroke="#64748B" stroke-width="1.5" fill="#FFFFFF"/>
<text x="457.0" y="89.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#0F172A">a</text>
<rect x="483" y="70" width="44" height="30" rx="4" stroke="#64748B" stroke-width="1.5" fill="#FFFFFF"/>
<text x="505.0" y="89.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#0F172A">a</text>
<rect x="531" y="70" width="44" height="30" rx="4" stroke="#64748B" stroke-width="1.5" fill="#FFFFFF"/>
<text x="553.0" y="89.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#0F172A">a</text>
<rect x="579" y="70" width="44" height="30" rx="4" stroke="#64748B" stroke-width="1.5" fill="#FFFFFF"/>
<text x="601.0" y="89.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#0F172A">a</text>
<rect x="627" y="70" width="82" height="30" rx="4" stroke="#64748B" stroke-width="1.5" fill="#FFFFFF"/>
<text x="668" y="89" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#0F172A">a</text>
<text x="345" y="127" font-size="12" fill="#64748B">Zeile 2</text>
<rect x="387" y="108" width="44" height="30" rx="4" stroke="#64748B" stroke-width="1.5" fill="#FFFFFF"/>
<text x="409.0" y="127.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#0F172A">b</text>
<rect x="435" y="108" width="44" height="30" rx="4" stroke="#64748B" stroke-width="1.5" fill="#FFFFFF"/>
<text x="457.0" y="127.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#0F172A">B</text>
<rect x="483" y="108" width="44" height="30" rx="4" stroke="#64748B" stroke-width="1.5" fill="#FFFFFF"/>
<text x="505.0" y="127.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#0F172A">b</text>
<rect x="531" y="108" width="44" height="30" rx="4" stroke="#64748B" stroke-width="1.5" fill="#FFFFFF"/>
<text x="553.0" y="127.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#0F172A">B1</text>
<rect x="579" y="108" width="44" height="30" rx="4" stroke="#64748B" stroke-width="1.5" fill="#FFFFFF"/>
<text x="601.0" y="127.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#0F172A">B2</text>
<rect x="627" y="108" width="82" height="30" rx="4" stroke="#0F172A" stroke-width="3" fill="#FFFFFF"/>
<text x="668" y="127" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#0F172A">B1 + B2 − B</text>
<text x="345" y="165" font-size="12" fill="#64748B">Zeile 3</text>
<rect x="387" y="146" width="44" height="30" rx="4" stroke="#64748B" stroke-width="1.5" fill="#FFFFFF"/>
<text x="409.0" y="165.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#0F172A">c</text>
<rect x="435" y="146" width="44" height="30" rx="4" stroke="#64748B" stroke-width="1.5" fill="#FFFFFF"/>
<text x="457.0" y="165.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#0F172A">c</text>
<rect x="483" y="146" width="44" height="30" rx="4" stroke="#64748B" stroke-width="1.5" fill="#FFFFFF"/>
<text x="505.0" y="165.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#0F172A">C</text>
<rect x="531" y="146" width="44" height="30" rx="4" stroke="#64748B" stroke-width="1.5" fill="#FFFFFF"/>
<text x="553.0" y="165.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#0F172A">C</text>
<rect x="579" y="146" width="44" height="30" rx="4" stroke="#64748B" stroke-width="1.5" fill="#FFFFFF"/>
<text x="601.0" y="165.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#0F172A">C</text>
<rect x="627" y="146" width="82" height="30" rx="4" stroke="#64748B" stroke-width="1.5" fill="#FFFFFF"/>
<text x="668" y="165" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#0F172A">C</text>
<text x="345" y="200" font-size="12" fill="#64748B">Zeile 1: Alle Terme gleich, a bleibt.</text>
<text x="345" y="217" font-size="12" fill="#64748B">Zeile 2: B1 + B2 − B − b + b. Beide Seiten ändern die</text>
<text x="345" y="232" font-size="12" fill="#64748B">Zeile b verschieden: b hebt sich auf, B1 + B2 − B bleibt.</text>
<text x="345" y="249" font-size="12" fill="#64748B">Zeile 3: C + C − c − C + c. C und c heben sich auf; es bleibt C.</text>
<text x="345" y="280" font-size="12" fill="#64748B">Zeile 2 hebt sich nicht auf (dicker Rahmen). Deshalb ist die</text>
<text x="345" y="295" font-size="12" fill="#64748B">ganze Datei ein Konflikt; sein Pfad trägt die Blobs ganz.</text>
</svg>
