<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 610" font-family="Helvetica, Arial, sans-serif">
<title>Zeiger vor und nach op restore 5</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
