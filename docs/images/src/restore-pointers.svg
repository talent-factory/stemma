</defs>
<rect x="0" y="0" width="580" height="610" fill="#FFFFFF"/>
<g font-size="13" font-weight="bold" fill="#0F172A">
  <text x="20" y="22">Vor <tspan font-family="Courier, monospace">op restore 5</tspan></text>
  <text x="20" y="302">Nach dem Restore, Eintrag 6</text>
</g>
