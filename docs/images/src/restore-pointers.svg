<!-- Explanation -->
<g font-size="12" fill="#0F172A">
  <text x="400" y="204">ohne Zeiger, seit der</text>
  <text x="400" y="220">Commit ihn als</text>
  <text x="400" y="236"><tspan font-family="Courier, monospace">b3:9d8a…</tspan> benannt hat</text>
  <text x="20" y="568">Das Restore setzt beide Zeiger auf die alten Werte von Eintrag 5 zurück.</text>
  <text x="20" y="584"><tspan font-family="Courier, monospace">b3:9d8a…</tspan> und <tspan font-family="Courier, monospace">b3:e394…</tspan> bleiben ohne Zeiger im Objektspeicher,</text>
  <text x="20" y="600">und <tspan font-family="Courier, monospace">op restore 6</tspan> setzt die Zeiger wieder auf sie.</text>
</g>
