<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="Helvetica, Arial, sans-serif">
<title>Stemma codicum mit Kontamination und Verlauf mit Merge</title>
<rect x="0" y="0" width="600" height="340" fill="#FFFFFF"/>
<g font-size="13" font-weight="bold" fill="#0F172A">
  <text x="20" y="22">Stemma codicum</text>
  <text x="320" y="22">Verlauf in Stemma (Merge ab Phase 3)</text>
</g>
<line x1="300" y1="10" x2="300" y2="300" stroke="#E2E8F0" stroke-width="1"/>
<!-- Left: manuscripts. Lines run from an exemplar down to its copy. -->
<g stroke="#64748B" stroke-width="1.5" fill="none">
  <line x1="150" y1="62" x2="85" y2="112"/>
  <line x1="150" y1="62" x2="215" y2="112"/>
  <line x1="85" y1="132" x2="50" y2="192"/>
  <line x1="85" y1="132" x2="120" y2="192"/>
  <line x1="215" y1="132" x2="195" y2="192"/>
  <line x1="215" y1="132" x2="255" y2="192"/>
  <line x1="120" y1="212" x2="165" y2="262"/>
  <line x1="195" y1="212" x2="172" y2="262" stroke-dasharray="5 3"/>
</g>
<g stroke-width="1.5">
  <circle cx="150" cy="52" r="12" fill="#FFFFFF" stroke="#64748B" stroke-dasharray="4 3"/>
  <circle cx="85" cy="122" r="12" fill="#FFFFFF" stroke="#64748B" stroke-dasharray="4 3"/>
  <circle cx="215" cy="122" r="12" fill="#FFFFFF" stroke="#64748B" stroke-dasharray="4 3"/>
  <circle cx="50" cy="202" r="12" fill="#FFFFFF" stroke="#64748B"/>
  <circle cx="120" cy="202" r="12" fill="#FFFFFF" stroke="#64748B"/>
  <circle cx="195" cy="202" r="12" fill="#FFFFFF" stroke="#64748B"/>
  <circle cx="255" cy="202" r="12" fill="#FFFFFF" stroke="#64748B"/>
  <circle cx="167" cy="272" r="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
</g>
<g font-size="13" fill="#0F172A" text-anchor="middle">
  <text x="150" y="57">Ω</text>
  <text x="85" y="127">α</text>
  <text x="215" y="127">β</text>
  <text x="50" y="207">A</text>
  <text x="120" y="207">B</text>
  <text x="195" y="207">C</text>
  <text x="255" y="207">E</text>
  <text x="167" y="277" font-weight="bold">D</text>
</g>
<g font-size="11" fill="#64748B">
  <text x="170" y="56">Archetypus, erschlossen</text>
  <text x="235" y="126">verloren</text>
  <text x="40" y="236">A bis E erhalten</text>
  <text x="187" y="276">zwei Vorlagen:</text>
  <text x="187" y="290">Kontamination</text>
</g>
<!-- Right: commits. Arrows run from a commit to its parents. -->
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#2F7D32"/>
  </marker>
</defs>
<g stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)">
  <line x1="440" y1="110" x2="440" y2="66"/>
  <line x1="390" y1="186" x2="432" y2="132"/>
  <line x1="500" y1="186" x2="448" y2="132"/>
  <line x1="440" y1="258" x2="398" y2="214"/>
  <line x1="440" y1="258" x2="492" y2="214"/>
</g>
<g stroke-width="1.5" fill="#FFFFFF">
  <rect x="400" y="40" width="80" height="24" rx="4" stroke="#64748B"/>
  <rect x="400" y="110" width="80" height="24" rx="4" stroke="#64748B"/>
  <rect x="350" y="190" width="80" height="24" rx="4" stroke="#64748B"/>
  <rect x="460" y="190" width="80" height="24" rx="4" stroke="#64748B"/>
  <rect x="400" y="260" width="80" height="24" rx="4" stroke="#0F172A" stroke-width="2"/>
</g>
<g font-family="Courier, monospace" font-size="11.5" fill="#0F172A" text-anchor="middle">
  <text x="440" y="56">b3:7a41…</text>
  <text x="440" y="126">b3:c2e0…</text>
  <text x="390" y="206">b3:19bd…</text>
  <text x="500" y="206">b3:f6a8…</text>
  <text x="440" y="276" font-weight="bold">b3:5d93…</text>
</g>
<rect x="500" y="262" width="54" height="20" rx="3" fill="#FFFFFF" stroke="#2F7D32" stroke-width="1.5"/>
<text x="527" y="276" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#2F7D32" text-anchor="middle">main</text>
<line x1="500" y1="272" x2="482" y2="272" stroke="#2F7D32" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<g font-size="11" fill="#64748B">
  <text x="490" y="56">erster Commit</text>
  <text x="330" y="300">Merge: zwei Eltern,</text>
  <text x="330" y="314">aufgezeichnet und durch den Hash geprüft</text>
</g>
<!-- Legend -->
<g font-size="11" fill="#64748B">
  <text x="20" y="314">Gestrichelt: erschlossen, nicht überliefert;</text>
  <text x="20" y="328">die gestrichelte Linie ist die zweite Vorlage.</text>
</g>
</svg>
