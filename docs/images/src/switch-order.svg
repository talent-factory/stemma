<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 504" font-family="Helvetica, Arial, sans-serif">
<title>Ablauf von switch, mit den Zuständen nach einem Absturz</title>
<defs>
  <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F7D32"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2B6CB0"/></marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker>
  <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B46C1"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker>
</defs>
<rect x="0" y="0" width="720" height="504" fill="#FFFFFF"/>
<text x="20" y="20" font-size="12" font-weight="bold" fill="#0F172A"><tspan font-family="Courier, monospace">switch feature</tspan> mit Änderungen im Working-Copy-Commit W</text>
<text x="20" y="36" font-size="12" fill="#64748B">W: der Working-Copy-Commit mit den Änderungen; ab Schritt 2 ist er gesichert. W′ trägt sie auf feature.</text>
<text x="284.0" y="56" font-size="12" font-weight="bold" text-anchor="middle" fill="#6B46C1">Eintrag im Log</text>
<text x="393.0" y="56" font-size="12" font-weight="bold" text-anchor="middle" font-family="Courier, monospace" fill="#2F7D32">HEAD</text>
<text x="503.0" y="56" font-size="12" font-weight="bold" text-anchor="middle" fill="#B45309">Working-Copy-Commit</text>
<text x="635.0" y="56" font-size="12" font-weight="bold" text-anchor="middle" fill="#2B6CB0">Dateien</text>
<text x="20" y="83" font-size="12" font-weight="bold" fill="#0F172A">1 Prüfen</text>
<rect x="222" y="64" width="124" height="30" rx="4" stroke="#64748B" stroke-width="1.5" fill="#FFFFFF"/>
<text x="284.0" y="83.0" font-size="12" text-anchor="middle" fill="#0F172A">–</text>
<rect x="350" y="64" width="86" height="30" rx="4" stroke="#2F7D32" stroke-width="1.5" fill="#FFFFFF"/>
<text x="393.0" y="83.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#2F7D32">main</text>
<rect x="440" y="64" width="126" height="30" rx="4" stroke="#B45309" stroke-width="1.5" fill="#FFFFFF"/>
<text x="503.0" y="83.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#B45309">W</text>
<rect x="570" y="64" width="130" height="30" rx="4" stroke="#2B6CB0" stroke-width="1.5" fill="#FFFFFF"/>
<text x="635.0" y="83.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#2B6CB0">von W</text>
<line x1="20" y1="102" x2="700" y2="102" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="20" y="117" font-size="12" fill="#B91C1C">Absturz hier: nichts geschrieben; der Aufruf lässt sich wiederholen.</text>
<text x="20" y="159" font-size="12" font-weight="bold" fill="#0F172A">2 Snapshot</text>
<rect x="222" y="140" width="124" height="30" rx="4" stroke="#6B46C1" stroke-width="1.5" fill="#FFFFFF"/>
<text x="284.0" y="159.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#6B46C1">snapshot</text>
<rect x="350" y="140" width="86" height="30" rx="4" stroke="#2F7D32" stroke-width="1.5" fill="#FFFFFF"/>
<text x="393.0" y="159.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#2F7D32">main</text>
<rect x="440" y="140" width="126" height="30" rx="4" stroke="#B45309" stroke-width="1.5" fill="#FFFFFF"/>
<text x="503.0" y="159.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#B45309">W</text>
<rect x="570" y="140" width="130" height="30" rx="4" stroke="#2B6CB0" stroke-width="1.5" fill="#FFFFFF"/>
<text x="635.0" y="159.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#2B6CB0">von W</text>
<line x1="20" y1="178" x2="700" y2="178" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="20" y="193" font-size="12" fill="#B91C1C">Absturz hier: nur der Eintrag <tspan font-family="Courier, monospace">snapshot</tspan> ist neu; der Aufruf lässt sich wiederholen.</text>
<text x="20" y="235" font-size="12" font-weight="bold" fill="#0F172A">3 Neuer Commit</text>
<rect x="222" y="216" width="124" height="30" rx="4" stroke="#6B46C1" stroke-width="1.5" fill="#FFFFFF"/>
<text x="284.0" y="235.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#6B46C1">snapshot</text>
<rect x="350" y="216" width="86" height="30" rx="4" stroke="#2F7D32" stroke-width="1.5" fill="#FFFFFF"/>
<text x="393.0" y="235.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#2F7D32">main</text>
<rect x="440" y="216" width="126" height="30" rx="4" stroke="#B45309" stroke-width="1.5" fill="#FFFFFF"/>
<text x="503.0" y="235.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#B45309">W</text>
<rect x="570" y="216" width="130" height="30" rx="4" stroke="#2B6CB0" stroke-width="1.5" fill="#FFFFFF"/>
<text x="635.0" y="235.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#2B6CB0">von W</text>
<line x1="20" y1="254" x2="700" y2="254" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="20" y="269" font-size="12" fill="#B91C1C">Absturz hier: höchstens der unerreichbare Commit W′; kein Zeiger hat sich bewegt.</text>
<text x="20" y="311" font-size="12" font-weight="bold" fill="#0F172A">4a Eintrag gesichert</text>
<rect x="222" y="292" width="124" height="30" rx="4" stroke="#6B46C1" stroke-width="1.5" fill="#FFFFFF"/>
<text x="284.0" y="311.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#6B46C1">switch</text>
<rect x="350" y="292" width="86" height="30" rx="4" stroke="#2F7D32" stroke-width="1.5" fill="#FFFFFF"/>
<text x="393.0" y="311.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#2F7D32">main</text>
<rect x="440" y="292" width="126" height="30" rx="4" stroke="#B45309" stroke-width="1.5" fill="#FFFFFF"/>
<text x="503.0" y="311.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#B45309">W</text>
<rect x="570" y="292" width="130" height="30" rx="4" stroke="#2B6CB0" stroke-width="1.5" fill="#FFFFFF"/>
<text x="635.0" y="311.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#2B6CB0">von W</text>
<line x1="20" y1="330" x2="700" y2="330" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="20" y="345" font-size="12" fill="#B91C1C">Absturz hier: der Eintrag steht, die Zeiger sind alt; <tspan font-family="Courier, monospace">op log</tspan> nennt den Ausgang unbekannt, bis die Sperre übernommen ist.</text>
<text x="20" y="387" font-size="12" font-weight="bold" fill="#0F172A">4b Dateien geschrieben</text>
<rect x="222" y="368" width="124" height="30" rx="4" stroke="#6B46C1" stroke-width="1.5" fill="#FFFFFF"/>
<text x="284.0" y="387.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#6B46C1">switch</text>
<rect x="350" y="368" width="86" height="30" rx="4" stroke="#2F7D32" stroke-width="1.5" fill="#FFFFFF"/>
<text x="393.0" y="387.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#2F7D32">main</text>
<rect x="440" y="368" width="126" height="30" rx="4" stroke="#B45309" stroke-width="1.5" fill="#FFFFFF"/>
<text x="503.0" y="387.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#B45309">W</text>
<rect x="570" y="368" width="130" height="30" rx="4" stroke="#2B6CB0" stroke-width="1.5" fill="#FFFFFF"/>
<text x="635.0" y="387.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#2B6CB0">von W′</text>
<line x1="20" y1="406" x2="700" y2="406" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="20" y="421" font-size="12" fill="#B91C1C">Absturz hier: Dateien des Ziels, alte Zeiger; derselbe Aufruf noch einmal setzt fort.</text>
<text x="20" y="463" font-size="12" font-weight="bold" fill="#0F172A">5 Zeiger bewegt</text>
<rect x="222" y="444" width="124" height="30" rx="4" stroke="#6B46C1" stroke-width="1.5" fill="#FFFFFF"/>
<text x="284.0" y="463.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#6B46C1">switch</text>
<rect x="350" y="444" width="86" height="30" rx="4" stroke="#2F7D32" stroke-width="1.5" fill="#FFFFFF"/>
<text x="393.0" y="463.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#2F7D32">feature</text>
<rect x="440" y="444" width="126" height="30" rx="4" stroke="#B45309" stroke-width="1.5" fill="#FFFFFF"/>
<text x="503.0" y="463.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#B45309">W′</text>
<rect x="570" y="444" width="130" height="30" rx="4" stroke="#2B6CB0" stroke-width="1.5" fill="#FFFFFF"/>
<text x="635.0" y="463.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#2B6CB0">von W′</text>
</svg>
