<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" font-family="Helvetica, Arial, sans-serif">
<title>Zeiger beim Merge-Gate: vor dem Gate, nach dem Gate und nach einem Absturz vor pr-merge mit dem Reparaturweg</title>
<defs>
  <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F7D32"/></marker>
</defs>
<rect x="0" y="0" width="600" height="600" fill="#FFFFFF"/>
<text x="20" y="20" font-size="13" font-weight="bold" fill="#0F172A">Vor dem Gate</text>
<rect x="20" y="88" width="56" height="26" rx="4" stroke="#64748B" stroke-width="1.5" fill="#FFFFFF"/>
<text x="48" y="105" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#0F172A">Basis</text>
<rect x="110" y="66" width="56" height="26" rx="4" stroke="#64748B" stroke-width="1.5" fill="#FFFFFF"/>
<text x="138" y="83" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#0F172A">T</text>
<rect x="110" y="116" width="56" height="26" rx="4" stroke="#64748B" stroke-width="1.5" fill="#FFFFFF"/>
<text x="138" y="133" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#0F172A">F</text>
<line x1="110" y1="79" x2="77" y2="97" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
<line x1="110" y1="129" x2="77" y2="105" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
<rect x="103" y="34" width="70" height="20" rx="3" stroke="#2F7D32" stroke-width="1.5" fill="#FFFFFF"/>
<text x="138" y="48" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#2F7D32">main</text>
<line x1="138" y1="54" x2="138" y2="65" stroke="#2F7D32" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<rect x="103" y="148" width="70" height="20" rx="3" stroke="#2F7D32" stroke-width="1.5" fill="#FFFFFF"/>
<text x="138" y="162" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#2F7D32">feature</text>
<line x1="138" y1="148" x2="138" y2="143" stroke="#2F7D32" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<text x="320" y="60" font-size="12" font-weight="bold" fill="#6B46C1">Log</text>
<text x="320" y="78" font-size="12" font-family="Courier, monospace" fill="#6B46C1">pr-open n</text>
<text x="320" y="108" font-size="11.5" fill="#64748B">Der Pull Request ist offen. <tspan font-family="Courier, monospace">main</tspan> zeigt auf die</text>
<text x="320" y="123" font-size="11.5" fill="#64748B">Spitze <tspan font-family="Courier, monospace">T</tspan>, <tspan font-family="Courier, monospace">feature</tspan> auf den Kopf <tspan font-family="Courier, monospace">F</tspan>.</text>
<text x="20" y="220" font-size="13" font-weight="bold" fill="#0F172A">Nach dem Gate</text>
<rect x="20" y="288" width="56" height="26" rx="4" stroke="#64748B" stroke-width="1.5" fill="#FFFFFF"/>
<text x="48" y="305" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#0F172A">Basis</text>
<rect x="110" y="266" width="56" height="26" rx="4" stroke="#64748B" stroke-width="1.5" fill="#FFFFFF"/>
<text x="138" y="283" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#0F172A">T</text>
<rect x="110" y="316" width="56" height="26" rx="4" stroke="#64748B" stroke-width="1.5" fill="#FFFFFF"/>
<text x="138" y="333" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#0F172A">F</text>
<line x1="110" y1="279" x2="77" y2="297" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
<line x1="110" y1="329" x2="77" y2="305" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
<rect x="200" y="266" width="56" height="26" rx="4" stroke="#2F7D32" stroke-width="1.5" fill="#FFFFFF"/>
<text x="228" y="283" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#0F172A">M</text>
<line x1="200" y1="279" x2="167" y2="279" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
<rect x="193" y="234" width="70" height="20" rx="3" stroke="#2F7D32" stroke-width="1.5" fill="#FFFFFF"/>
<text x="228" y="248" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#2F7D32">main</text>
<line x1="228" y1="254" x2="228" y2="265" stroke="#2F7D32" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<rect x="103" y="348" width="70" height="20" rx="3" stroke="#2F7D32" stroke-width="1.5" fill="#FFFFFF"/>
<text x="138" y="362" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#2F7D32">feature</text>
<line x1="138" y1="348" x2="138" y2="343" stroke="#2F7D32" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<text x="320" y="260" font-size="12" font-weight="bold" fill="#6B46C1">Log</text>
<text x="320" y="278" font-size="12" font-family="Courier, monospace" fill="#6B46C1">pr-open n</text>
<text x="320" y="294" font-size="12" font-family="Courier, monospace" fill="#6B46C1">gate-merge</text>
<text x="320" y="310" font-size="12" font-family="Courier, monospace" fill="#6B46C1">pr-merge</text>
<text x="320" y="336" font-size="11.5" fill="#64748B"><tspan font-family="Courier, monospace">M</tspan> ist der Squash-Commit der Änderung auf <tspan font-family="Courier, monospace">T</tspan>;</text>
<text x="320" y="351" font-size="11.5" fill="#64748B"><tspan font-family="Courier, monospace">feature</tspan> bleibt bei <tspan font-family="Courier, monospace">F</tspan>.</text>
<text x="20" y="420" font-size="13" font-weight="bold" fill="#B91C1C">Nach einem Absturz nach der Bewegung von <tspan font-family="Courier, monospace">main</tspan></text>
<rect x="20" y="488" width="56" height="26" rx="4" stroke="#64748B" stroke-width="1.5" fill="#FFFFFF"/>
<text x="48" y="505" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#0F172A">Basis</text>
<rect x="110" y="466" width="56" height="26" rx="4" stroke="#64748B" stroke-width="1.5" fill="#FFFFFF"/>
<text x="138" y="483" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#0F172A">T</text>
<rect x="110" y="516" width="56" height="26" rx="4" stroke="#64748B" stroke-width="1.5" fill="#FFFFFF"/>
<text x="138" y="533" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#0F172A">F</text>
<line x1="110" y1="479" x2="77" y2="497" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
<line x1="110" y1="529" x2="77" y2="505" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
<rect x="200" y="466" width="56" height="26" rx="4" stroke="#2F7D32" stroke-width="1.5" fill="#FFFFFF"/>
<text x="228" y="483" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#0F172A">M</text>
<line x1="200" y1="479" x2="167" y2="479" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
<rect x="193" y="434" width="70" height="20" rx="3" stroke="#2F7D32" stroke-width="1.5" fill="#FFFFFF"/>
<text x="228" y="448" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#2F7D32">main</text>
<line x1="228" y1="454" x2="228" y2="465" stroke="#2F7D32" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<rect x="103" y="548" width="70" height="20" rx="3" stroke="#2F7D32" stroke-width="1.5" fill="#FFFFFF"/>
<text x="138" y="562" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#2F7D32">feature</text>
<line x1="138" y1="548" x2="138" y2="543" stroke="#2F7D32" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<text x="320" y="460" font-size="12" font-weight="bold" fill="#6B46C1">Log</text>
<text x="320" y="478" font-size="12" font-family="Courier, monospace" fill="#6B46C1">pr-open n</text>
<text x="320" y="494" font-size="12" font-family="Courier, monospace" fill="#6B46C1">gate-merge</text>
<text x="320" y="512" font-size="12" font-weight="bold" fill="#B91C1C"><tspan font-family="Courier, monospace">pr-merge</tspan> fehlt: Pull Request <tspan font-family="Courier, monospace">open</tspan></text>
<line x1="316" y1="500" x2="560" y2="500" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="320" y="538" font-size="11.5" fill="#64748B">Reparaturweg: Der Merge von <tspan font-family="Courier, monospace">F</tspan> auf <tspan font-family="Courier, monospace">M</tspan> ändert den</text>
<text x="320" y="553" font-size="11.5" fill="#64748B">Tree nicht. Das Gate schreibt nur <tspan font-family="Courier, monospace">pr-merge</tspan>, <tspan font-family="Courier, monospace">main</tspan></text>
<text x="320" y="568" font-size="11.5" fill="#64748B">bleibt bei <tspan font-family="Courier, monospace">M</tspan>.</text>
</svg>
