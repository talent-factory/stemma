<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" font-family="Helvetica, Arial, sans-serif">
<title>Abbruch und Wiederholung: Zustände von switch, merge, rebase und Umschreiben</title>
<defs>
  <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F7D32"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2B6CB0"/></marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker>
  <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B46C1"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker>
</defs>
<rect x="0" y="0" width="720" height="372" fill="#FFFFFF"/>
<rect x="30" y="130" width="150" height="56" rx="8" stroke="#64748B" stroke-width="1.5" fill="#FFFFFF"/>
<text x="105.0" y="152" font-size="12" font-weight="bold" text-anchor="middle" fill="#64748B">Ruhe</text>
<text x="105.0" y="168" font-size="12" text-anchor="middle" fill="#64748B">Zeiger und Log stimmen</text>
<rect x="250" y="130" width="190" height="56" rx="8" stroke="#6B46C1" stroke-width="1.5" fill="#FFFFFF"/>
<text x="345.0" y="152" font-size="12" font-weight="bold" text-anchor="middle" fill="#6B46C1">Befehl läuft</text>
<text x="345.0" y="168" font-size="12" text-anchor="middle" fill="#64748B">Snapshot, Eintrag, Dateien, Zeiger</text>
<rect x="520" y="40" width="170" height="56" rx="8" stroke="#0F172A" stroke-width="1.5" fill="#FFFFFF"/>
<text x="605.0" y="62" font-size="12" font-weight="bold" text-anchor="middle" fill="#0F172A">Fertig</text>
<text x="605.0" y="78" font-size="12" text-anchor="middle" fill="#64748B">alle Zeiger bewegt</text>
<rect x="520" y="220" width="170" height="64" rx="8" stroke="#B91C1C" stroke-width="1.5" fill="#FFFFFF"/>
<text x="605.0" y="242" font-size="12" font-weight="bold" text-anchor="middle" fill="#B91C1C">Abgebrochen</text>
<text x="605.0" y="258" font-size="12" text-anchor="middle" fill="#64748B">Eintrag steht, Zeiger alt</text>
<text x="605.0" y="270" font-size="12" text-anchor="middle" fill="#64748B">oder zum Teil bewegt</text>
<line x1="180" y1="158" x2="248" y2="158" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
<text x="214" y="150" font-size="12" text-anchor="middle" fill="#64748B">Aufruf</text>
<line x1="440" y1="140" x2="518" y2="80" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
<text x="470" y="98" font-size="12" text-anchor="end" fill="#64748B">Erfolg</text>
<line x1="440" y1="176" x2="518" y2="236" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
<text x="470" y="214" font-size="12" text-anchor="end" fill="#B91C1C">Abbruch nach dem Eintrag</text>
<text x="470" y="228" font-size="12" text-anchor="end" fill="#64748B">(Exit-Code 3, wenn ein Zeiger bewegt ist, sonst der Code des Fehlers)</text>
<path d="M 345 130 C 345 80 105 80 105 128" stroke="#B91C1C" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
<text x="225" y="76" font-size="12" text-anchor="middle" fill="#B91C1C">Abbruch vor dem Eintrag: höchstens der Snapshot ist neu</text>
<line x1="640" y1="218" x2="640" y2="98" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
<text x="630" y="136" font-size="12" text-anchor="end" fill="#64748B">derselbe Aufruf noch einmal</text>
<text x="630" y="150" font-size="12" text-anchor="end" fill="#64748B">(<tspan font-family="Courier, monospace">switch</tspan>, <tspan font-family="Courier, monospace">merge</tspan>, <tspan font-family="Courier, monospace">rebase</tspan>,</text>
<text x="630" y="164" font-size="12" text-anchor="end" fill="#64748B">Umschreiben): kein Snapshot,</text>
<text x="630" y="178" font-size="12" text-anchor="end" fill="#64748B">die Commits des Eintrags</text>
<text x="20" y="316" font-size="12" fill="#64748B">Anderes Ziel bei <tspan font-family="Courier, monospace">merge</tspan>, <tspan font-family="Courier, monospace">rebase</tspan> und dem Umschreiben: abgelehnt, die Meldung nennt den abgebrochenen Stand.</text>
<text x="20" y="332" font-size="12" fill="#64748B">Jeder andere Befehl, auch <tspan font-family="Courier, monospace">switch</tspan> mit anderem Ziel: keine Wiederholung; sein Snapshot</text>
<text x="20" y="348" font-size="12" fill="#64748B">speichert die Dateien des Ziels als Änderung des alten Working-Copy-Commits.</text>
<text x="20" y="22" font-size="12" fill="#64748B">Es gibt weder <tspan font-family="Courier, monospace">--continue</tspan> noch <tspan font-family="Courier, monospace">--abort</tspan>: Der Verlauf beschreibt jeden Zustand.</text>
</svg>
