<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 858" font-family="Helvetica, Arial, sans-serif">
<title>Die Sitzung der Phase 4: Daniel, der Agent und Ana</title>
<rect x="0" y="0" width="840" height="858" fill="#FFFFFF"/>
<text x="20" y="38" font-size="12" font-weight="bold" fill="#6B46C1">Eintrag</text>
