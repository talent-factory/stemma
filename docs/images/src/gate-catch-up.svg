<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" font-family="Helvetica, Arial, sans-serif">
<title>Der Haupt-Worktree folgt main nach dem Merge-Gate</title>
<rect x="0" y="0" width="840" height="400" fill="#FFFFFF"/>
<text x="20" y="24" font-size="12" font-weight="bold" fill="#0F172A">Vor dem Gate</text>
<text x="20" y="40" font-size="12" fill="#64748B"></text>
<rect x="20" y="56" width="240" height="56" rx="4" fill="#FFFFFF" stroke="#2F7D32" stroke-width="1.5"/>
<text x="30" y="74" font-size="12" font-weight="bold" fill="#2F7D32">Branch main</text>
<text x="30" y="92" font-size="12" font-family="Courier, monospace" fill="#0F172A">b3:8ca6…0cd7</text>
<rect x="20" y="128" width="240" height="72" rx="4" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<text x="30" y="146" font-size="12" font-weight="bold" fill="#B45309">Working-Copy-Commit</text>
<text x="30" y="164" font-size="12" font-family="Courier, monospace" fill="#0F172A">Elternteil</text>
<text x="30" y="180" font-size="12" font-family="Courier, monospace" fill="#0F172A">b3:8ca6…0cd7</text>
<rect x="20" y="216" width="240" height="56" rx="4" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="1.5"/>
<text x="30" y="234" font-size="12" font-weight="bold" fill="#2B6CB0">Arbeitsverzeichnis</text>
<text x="30" y="252" font-size="12" font-family="Courier, monospace" fill="#0F172A">main.rs</text>
<text x="264" y="150" font-size="16" fill="#64748B">→</text>
<text x="290" y="24" font-size="12" font-weight="bold" fill="#0F172A">pr merge 14: nach dem Gate</text>
<text x="290" y="40" font-size="12" fill="#64748B">Einträge 18 und 19</text>
<rect x="290" y="56" width="240" height="56" rx="4" fill="#FFFFFF" stroke="#2F7D32" stroke-width="1.5"/>
<text x="300" y="74" font-size="12" font-weight="bold" fill="#2F7D32">Branch main</text>
<text x="300" y="92" font-size="12" font-family="Courier, monospace" fill="#0F172A">b3:d791…d510</text>
<rect x="290" y="128" width="240" height="72" rx="4" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<text x="300" y="146" font-size="12" font-weight="bold" fill="#B45309">Working-Copy-Commit</text>
<text x="300" y="164" font-size="12" font-family="Courier, monospace" fill="#0F172A">Elternteil</text>
<text x="300" y="180" font-size="12" font-family="Courier, monospace" fill="#0F172A">b3:8ca6…0cd7</text>
<rect x="290" y="216" width="240" height="56" rx="4" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="1.5"/>
<text x="300" y="234" font-size="12" font-weight="bold" fill="#2B6CB0">Arbeitsverzeichnis</text>
<text x="300" y="252" font-size="12" font-family="Courier, monospace" fill="#0F172A">main.rs</text>
<text x="290" y="296" font-size="12" font-weight="bold" fill="#64748B">main und Elternteil weichen ab:</text>
<text x="290" y="312" font-size="12" fill="#64748B">Ein <tspan font-family="Courier, monospace">commit</tspan> würde ablehnen. So bleibt</text>
<text x="290" y="328" font-size="12" fill="#64748B">ein Worktree stehen, der nicht folgt.</text>
<text x="534" y="150" font-size="16" fill="#64748B">→</text>
<text x="560" y="24" font-size="12" font-weight="bold" fill="#0F172A">pr merge 14: nach dem Nachziehen</text>
<text x="560" y="40" font-size="12" fill="#64748B">Eintrag 20 (<tspan font-family="Courier, monospace">switch</tspan>)</text>
<rect x="560" y="56" width="240" height="56" rx="4" fill="#FFFFFF" stroke="#2F7D32" stroke-width="1.5"/>
<text x="570" y="74" font-size="12" font-weight="bold" fill="#2F7D32">Branch main</text>
<text x="570" y="92" font-size="12" font-family="Courier, monospace" fill="#0F172A">b3:d791…d510</text>
<rect x="560" y="128" width="240" height="72" rx="4" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<text x="570" y="146" font-size="12" font-weight="bold" fill="#B45309">Working-Copy-Commit</text>
<text x="570" y="164" font-size="12" font-family="Courier, monospace" fill="#0F172A">Elternteil</text>
<text x="570" y="180" font-size="12" font-family="Courier, monospace" fill="#0F172A">b3:d791…d510</text>
<rect x="560" y="216" width="240" height="56" rx="4" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="1.5"/>
<text x="570" y="234" font-size="12" font-weight="bold" fill="#2B6CB0">Arbeitsverzeichnis</text>
<text x="570" y="252" font-size="12" font-family="Courier, monospace" fill="#0F172A">lib.rs, main.rs</text>
<text x="560" y="296" font-size="12" font-weight="bold" fill="#64748B">Elternteil und Dateien folgen main;</text>
<text x="560" y="312" font-size="12" fill="#64748B">ein <tspan font-family="Courier, monospace">commit</tspan> ist wieder möglich.</text>
<text x="20" y="352" font-size="12" fill="#64748B">Das Gate bewegt nur main (<tspan font-family="Courier, monospace">gate-merge</tspan>, Eintrag 18; <tspan font-family="Courier, monospace">pr-merge</tspan>, Eintrag 19). Danach zieht <tspan font-family="Courier, monospace">pr merge</tspan> den Worktree nach,</text>
<text x="20" y="368" font-size="12" fill="#64748B">der main ausgecheckt hat. Folgt er nicht, holt sein Eigentümer ihn mit <tspan font-family="Courier, monospace">switch main</tspan> nach.</text>
</svg>
