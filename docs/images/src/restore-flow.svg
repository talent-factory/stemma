<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 660" font-family="Helvetica, Arial, sans-serif">
<title>Ablauf eines Restore mit Absturzpunkten</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
  </marker>
</defs>
<rect x="0" y="0" width="580" height="660" fill="#FFFFFF"/>
<!-- Steps: the bar on the left carries the colour of the zone that the step writes -->
<g stroke="#64748B" stroke-width="1" fill="#FFFFFF">
  <rect x="20" y="20" width="250" height="46" rx="4"/>
  <rect x="20" y="96" width="250" height="46" rx="4"/>
  <rect x="20" y="172" width="250" height="46" rx="4"/>
  <rect x="20" y="248" width="250" height="46" rx="4"/>
  <rect x="20" y="324" width="250" height="46" rx="4"/>
  <rect x="20" y="400" width="250" height="46" rx="4"/>
  <rect x="20" y="476" width="250" height="46" rx="4"/>
  <rect x="20" y="552" width="250" height="46" rx="4"/>
</g>
<g>
  <rect x="20" y="20" width="8" height="46" fill="#64748B"/>
  <rect x="20" y="96" width="8" height="46" fill="#64748B"/>
  <rect x="20" y="172" width="8" height="46" fill="#B45309"/>
  <rect x="20" y="248" width="8" height="46" fill="#6B46C1"/>
  <rect x="20" y="324" width="8" height="46" fill="#2B6CB0"/>
  <rect x="20" y="400" width="8" height="46" fill="#2F7D32"/>
  <rect x="20" y="476" width="8" height="46" fill="#2F7D32"/>
  <rect x="20" y="552" width="8" height="46" fill="#64748B"/>
</g>
<g font-size="13" font-weight="bold" fill="#0F172A">
  <text x="40" y="39">1  Prüfen und planen</text>
  <text x="40" y="115">2  Sperre nehmen</text>
  <text x="40" y="191" fill="#B45309">3  Snapshot</text>
  <text x="40" y="267" fill="#6B46C1">4  Eintrag schreiben</text>
  <text x="40" y="343" fill="#2B6CB0">5  Verzeichnis schreiben</text>
  <text x="40" y="419" fill="#2F7D32">6  Branches bewegen</text>
  <text x="40" y="495" fill="#2F7D32">7  Working-Copy-Commit, HEAD</text>
  <text x="40" y="571">8  Sperre freigeben</text>
</g>
<g font-size="11.5" fill="#64748B">
  <text x="56" y="57">Eintrag beurteilen, Commits und Dateien</text>
  <text x="56" y="133"><tspan font-family="Courier, monospace">refs.lock</tspan> anlegen, <tspan font-family="Courier, monospace">tmp/</tspan> aufräumen</text>
  <text x="56" y="209">Verzeichnis festhalten, neu planen</text>
  <text x="56" y="285">Operation <tspan font-family="Courier, monospace">restore</tspan></text>
  <text x="56" y="361">Dateien des alten Baums</text>
  <text x="56" y="437">auf die Werte vor dem Eintrag</text>
  <text x="56" y="513">ebenso, HEAD zuletzt</text>
  <text x="56" y="589"><tspan font-family="Courier, monospace">refs.lock</tspan> entfernen</text>
</g>
<!-- Arrows between the steps -->
<g stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)">
  <line x1="145" y1="66" x2="145" y2="94"/>
  <line x1="145" y1="142" x2="145" y2="170"/>
  <line x1="145" y1="218" x2="145" y2="246"/>
  <line x1="145" y1="294" x2="145" y2="322"/>
  <line x1="145" y1="370" x2="145" y2="398"/>
  <line x1="145" y1="446" x2="145" y2="474"/>
  <line x1="145" y1="522" x2="145" y2="550"/>
</g>
<!-- Crash points: what remains after a crash at this point -->
<g stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="6 4">
  <line x1="20" y1="233" x2="292" y2="233"/>
  <line x1="20" y1="309" x2="292" y2="309"/>
  <line x1="20" y1="385" x2="292" y2="385"/>
  <line x1="20" y1="461" x2="292" y2="461"/>
</g>
<g font-size="12.5" font-weight="bold" fill="#B91C1C">
  <text x="302" y="229">Absturz: Snapshot steht</text>
  <text x="302" y="305">Absturz: Eintrag steht</text>
  <text x="302" y="381">Absturz: Dateien geschrieben</text>
  <text x="302" y="457">Absturz: Zeiger zum Teil bewegt</text>
</g>
<g font-size="12" fill="#0F172A">
  <text x="302" y="246">Ungesicherte Änderungen hält ein</text>
  <text x="302" y="261">Eintrag <tspan font-family="Courier, monospace">snapshot</tspan> fest; sonst ist</text>
  <text x="302" y="276">nichts geschehen.</text>
  <text x="302" y="322">Das Log nennt ein Restore, das nicht</text>
  <text x="302" y="337">stattfand. Dateien und Zeiger sind</text>
  <text x="302" y="352">unverändert.</text>
  <text x="302" y="398">Auch zum Teil. Kein Zeiger hat sich bewegt;</text>
  <text x="302" y="413">derselbe Aufruf hält die Dateien im</text>
  <text x="302" y="428">Snapshot fest und beendet das Restore.</text>
  <text x="302" y="474">Derselbe Aufruf lässt, was stimmt,</text>
  <text x="302" y="489">und bewegt den Rest.</text>
</g>
<!-- The lock remains after every crash point -->
<text x="302" y="604" font-size="11.5" fill="#64748B">Nach jedem Absturz bleibt <tspan font-family="Courier, monospace">refs.lock</tspan></text>
<text x="302" y="619" font-size="11.5" fill="#64748B">liegen. Der nächste Befehl, der</text>
<text x="302" y="634" font-size="11.5" fill="#64748B">schreibt, übernimmt sie (derselbe Rechner).</text>
</svg>
