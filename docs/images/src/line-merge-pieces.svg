<text x="20" y="262" font-size="11" fill="#64748B">fix: Fixzeile. Jeder Vergleich mit der Basis ordnet sie einer gleichen Zeile zu.</text>
<text x="20" y="278" font-size="11" fill="#64748B">Dicker Rahmen: Zeile, die sich gegenüber der Basis ändert.</text>
<text x="20" y="294" font-size="11" fill="#64748B">Die eigene Seite ändert Zwischenstück 1, die andere Zwischenstück 2: Jedes Stück hebt sich auf.</text>
<text x="20" y="310" font-size="11" fill="#64748B">Ändern beide Seiten dasselbe Stück verschieden, ist die ganze Datei ein Konflikt.</text>
