<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 704" font-family="Helvetica, Arial, sans-serif">
<title>Die Arbeitskopie umschreiben: Verlauf und Zustände nach einem Absturz</title>
<defs>
  <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F7D32"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2B6CB0"/></marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker>
  <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B46C1"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker>
</defs>
<rect x="0" y="0" width="720" height="704" fill="#FFFFFF"/>
<text x="20" y="24" font-size="12" font-weight="bold" fill="#0F172A">Verlauf vor dem Umschreiben</text>
<text x="380" y="24" font-size="12" font-weight="bold" fill="#0F172A">Verlauf danach</text>
<rect x="20" y="90" width="56" height="26" rx="4" stroke="#64748B" stroke-width="1.5" fill="#FFFFFF"/>
<text x="48.0" y="107.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#0F172A">P</text>
<rect x="100" y="50" width="56" height="26" rx="4" stroke="#B45309" stroke-width="1.5" fill="#FFFFFF"/>
<text x="128.0" y="67.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#B45309">W</text>
<rect x="100" y="130" width="56" height="26" rx="4" stroke="#64748B" stroke-width="1.5" fill="#FFFFFF"/>
<text x="128.0" y="147.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#0F172A">T</text>
<line x1="100" y1="63" x2="77" y2="100" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
<text x="66" y="150" font-size="12" text-anchor="middle" fill="#64748B">…</text>
<text x="170" y="67" font-size="12" fill="#B45309">Working-Copy-Commit</text>
<text x="170" y="147" font-size="12" fill="#64748B">neue Basis, die Spitze T</text>
<rect x="380" y="90" width="56" height="26" rx="4" stroke="#64748B" stroke-width="1.5" fill="#FFFFFF"/>
<text x="408.0" y="107.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#0F172A">P</text>
<rect x="460" y="130" width="56" height="26" rx="4" stroke="#64748B" stroke-width="1.5" fill="#FFFFFF"/>
<text x="488.0" y="147.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#0F172A">T</text>
<text x="446" y="150" font-size="12" text-anchor="middle" fill="#64748B">…</text>
<rect x="540" y="130" width="56" height="26" rx="4" stroke="#B45309" stroke-width="1.5" fill="#FFFFFF"/>
<text x="568.0" y="147.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#B45309">W′</text>
<line x1="540" y1="143" x2="517" y2="143" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
<rect x="460" y="50" width="56" height="26" rx="4" stroke="#64748B" stroke-width="1.5" fill="#FFFFFF" stroke-dasharray="6 4"/>
<text x="488.0" y="67.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#0F172A">W</text>
<line x1="460" y1="63" x2="437" y2="100" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-slate)"/>
<text x="530" y="67" font-size="12" fill="#64748B">bleibt im Log</text>
<text x="20" y="195" font-size="12" fill="#0F172A">Inhalt von W′ = T + (W − P); W′ behält Change-ID, Autor, Zeit und Beschreibung.</text>
<text x="20" y="213" font-size="12" fill="#64748B"><tspan font-family="Courier, monospace">HEAD</tspan> und die Branches bewegen sich nicht. Als eigener Schritt schreibt er den Eintrag <tspan font-family="Courier, monospace">rewrite</tspan>;</text>
<text x="20" y="229" font-size="12" fill="#64748B"><tspan font-family="Courier, monospace">merge</tspan> und <tspan font-family="Courier, monospace">rebase</tspan> führen ihn zusammen mit dem Branch in einem Eintrag aus.</text>
<text x="284.0" y="256" font-size="12" font-weight="bold" text-anchor="middle" fill="#6B46C1">Eintrag im Log</text>
<text x="425.0" y="256" font-size="12" font-weight="bold" text-anchor="middle" fill="#B45309">Working-Copy-Commit</text>
<text x="575.0" y="256" font-size="12" font-weight="bold" text-anchor="middle" fill="#2B6CB0">Dateien</text>
<text x="20" y="283" font-size="12" font-weight="bold" fill="#0F172A">1 Autorisierer, Sperre</text>
<rect x="222" y="264" width="124" height="30" rx="4" stroke="#64748B" stroke-width="1.5" fill="#FFFFFF"/>
<text x="284.0" y="283.0" font-size="12" text-anchor="middle" fill="#0F172A">–</text>
<rect x="350" y="264" width="150" height="30" rx="4" stroke="#B45309" stroke-width="1.5" fill="#FFFFFF"/>
<text x="425.0" y="283.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#B45309">W</text>
<rect x="510" y="264" width="130" height="30" rx="4" stroke="#2B6CB0" stroke-width="1.5" fill="#FFFFFF"/>
<text x="575.0" y="283.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#2B6CB0">von W</text>
<line x1="20" y1="302" x2="700" y2="302" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="20" y="317" font-size="12" fill="#B91C1C">Absturz hier: nichts geschrieben; der Aufruf lässt sich wiederholen.</text>
<text x="20" y="359" font-size="12" font-weight="bold" fill="#0F172A">2 Snapshot</text>
<rect x="222" y="340" width="124" height="30" rx="4" stroke="#6B46C1" stroke-width="1.5" fill="#FFFFFF"/>
<text x="284.0" y="359.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#6B46C1">snapshot</text>
<rect x="350" y="340" width="150" height="30" rx="4" stroke="#B45309" stroke-width="1.5" fill="#FFFFFF"/>
<text x="425.0" y="359.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#B45309">W</text>
<rect x="510" y="340" width="130" height="30" rx="4" stroke="#2B6CB0" stroke-width="1.5" fill="#FFFFFF"/>
<text x="575.0" y="359.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#2B6CB0">von W</text>
<line x1="20" y1="378" x2="700" y2="378" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="20" y="393" font-size="12" fill="#B91C1C">Absturz hier: nur der Eintrag <tspan font-family="Courier, monospace">snapshot</tspan> ist neu; der Aufruf lässt sich wiederholen.</text>
<text x="20" y="435" font-size="12" font-weight="bold" fill="#0F172A">3 W′ in den Speicher</text>
<rect x="222" y="416" width="124" height="30" rx="4" stroke="#6B46C1" stroke-width="1.5" fill="#FFFFFF"/>
<text x="284.0" y="435.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#6B46C1">snapshot</text>
<rect x="350" y="416" width="150" height="30" rx="4" stroke="#B45309" stroke-width="1.5" fill="#FFFFFF"/>
<text x="425.0" y="435.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#B45309">W</text>
<rect x="510" y="416" width="130" height="30" rx="4" stroke="#2B6CB0" stroke-width="1.5" fill="#FFFFFF"/>
<text x="575.0" y="435.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#2B6CB0">von W</text>
<line x1="20" y1="454" x2="700" y2="454" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="20" y="469" font-size="12" fill="#B91C1C">Absturz hier: höchstens der unerreichbare Commit W′; kein Zeiger hat sich bewegt.</text>
<text x="20" y="511" font-size="12" font-weight="bold" fill="#0F172A">4a Eintrag gesichert</text>
<rect x="222" y="492" width="124" height="30" rx="4" stroke="#6B46C1" stroke-width="1.5" fill="#FFFFFF"/>
<text x="284.0" y="511.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#6B46C1">rewrite</text>
<rect x="350" y="492" width="150" height="30" rx="4" stroke="#B45309" stroke-width="1.5" fill="#FFFFFF"/>
<text x="425.0" y="511.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#B45309">W</text>
<rect x="510" y="492" width="130" height="30" rx="4" stroke="#2B6CB0" stroke-width="1.5" fill="#FFFFFF"/>
<text x="575.0" y="511.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#2B6CB0">von W</text>
<line x1="20" y1="530" x2="700" y2="530" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="20" y="545" font-size="12" fill="#B91C1C">Absturz hier: der Eintrag steht, der Zeiger ist alt; <tspan font-family="Courier, monospace">op log</tspan> nennt den Ausgang unbekannt, bis die Sperre übernommen ist.</text>
<text x="20" y="587" font-size="12" font-weight="bold" fill="#0F172A">4b Dateien geschrieben</text>
<rect x="222" y="568" width="124" height="30" rx="4" stroke="#6B46C1" stroke-width="1.5" fill="#FFFFFF"/>
<text x="284.0" y="587.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#6B46C1">rewrite</text>
<rect x="350" y="568" width="150" height="30" rx="4" stroke="#B45309" stroke-width="1.5" fill="#FFFFFF"/>
<text x="425.0" y="587.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#B45309">W</text>
<rect x="510" y="568" width="130" height="30" rx="4" stroke="#2B6CB0" stroke-width="1.5" fill="#FFFFFF"/>
<text x="575.0" y="587.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#2B6CB0">von W′</text>
<line x1="20" y1="606" x2="700" y2="606" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="20" y="621" font-size="12" fill="#B91C1C">Absturz hier: neue Dateien, alter Zeiger; derselbe Aufruf noch einmal, ohne Snapshot.</text>
<text x="20" y="663" font-size="12" font-weight="bold" fill="#0F172A">4c Zeiger bewegt</text>
<rect x="222" y="644" width="124" height="30" rx="4" stroke="#6B46C1" stroke-width="1.5" fill="#FFFFFF"/>
<text x="284.0" y="663.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#6B46C1">rewrite</text>
<rect x="350" y="644" width="150" height="30" rx="4" stroke="#B45309" stroke-width="1.5" fill="#FFFFFF"/>
<text x="425.0" y="663.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#B45309">W′</text>
<rect x="510" y="644" width="130" height="30" rx="4" stroke="#2B6CB0" stroke-width="1.5" fill="#FFFFFF"/>
<text x="575.0" y="663.0" font-size="12" font-family="Courier, monospace" font-weight="bold" text-anchor="middle" fill="#2B6CB0">von W′</text>
</svg>
