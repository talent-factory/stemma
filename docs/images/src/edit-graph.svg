<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" font-family="Helvetica, Arial, sans-serif">
  <title>Editiergraph mit der Mittelschlange</title>
  <rect x="0" y="0" width="700" height="470" fill="#FFFFFF"/>
  <!-- Sequence letters: A (old) across the top, B (new) down the left -->
  <text x="70" y="26" font-size="12" font-weight="bold" fill="#0F172A">alte Folge a (löschen: nach rechts)</text>
  <g font-family="Courier, monospace" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">
    <text x="94" y="66">A</text>
    <text x="142" y="66">B</text>
    <text x="190" y="66">C</text>
    <text x="238" y="66">A</text>
    <text x="286" y="66">B</text>
    <text x="334" y="66">B</text>
    <text x="382" y="66">A</text>
  </g>
  <text x="14" y="224" font-size="12" font-weight="bold" fill="#0F172A" transform="rotate(-90 14 224)" text-anchor="middle">neue Folge b (einfügen: nach unten)</text>
  <g font-family="Courier, monospace" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">
    <text x="48" y="109">C</text>
    <text x="48" y="157">B</text>
    <text x="48" y="205">A</text>
    <text x="48" y="253">B</text>
    <text x="48" y="301">A</text>
    <text x="48" y="349">C</text>
  </g>
  <!-- Grid lines: the free steps right and down -->
  <g stroke="#64748B" stroke-opacity="0.45" stroke-width="1">
    <line x1="70" y1="80" x2="406" y2="80"/>
    <line x1="70" y1="128" x2="406" y2="128"/>
    <line x1="70" y1="176" x2="406" y2="176"/>
    <line x1="70" y1="224" x2="406" y2="224"/>
    <line x1="70" y1="272" x2="406" y2="272"/>
    <line x1="70" y1="320" x2="406" y2="320"/>
    <line x1="70" y1="368" x2="406" y2="368"/>
    <line x1="70" y1="80" x2="70" y2="368"/>
    <line x1="118" y1="80" x2="118" y2="368"/>
    <line x1="166" y1="80" x2="166" y2="368"/>
    <line x1="214" y1="80" x2="214" y2="368"/>
    <line x1="262" y1="80" x2="262" y2="368"/>
    <line x1="310" y1="80" x2="310" y2="368"/>
    <line x1="358" y1="80" x2="358" y2="368"/>
    <line x1="406" y1="80" x2="406" y2="368"/>
  </g>
  <!-- Diagonals: only where a[x] = b[y], free of cost -->
  <g stroke="#64748B" stroke-width="1.5">
    <line x1="166" y1="80" x2="214" y2="128"/>
    <line x1="118" y1="128" x2="166" y2="176"/>
    <line x1="262" y1="128" x2="310" y2="176"/>
    <line x1="310" y1="128" x2="358" y2="176"/>
    <line x1="70" y1="176" x2="118" y2="224"/>
    <line x1="214" y1="176" x2="262" y2="224"/>
    <line x1="358" y1="176" x2="406" y2="224"/>
    <line x1="118" y1="224" x2="166" y2="272"/>
    <line x1="262" y1="224" x2="310" y2="272"/>
    <line x1="310" y1="224" x2="358" y2="272"/>
    <line x1="70" y1="272" x2="118" y2="320"/>
    <line x1="214" y1="272" x2="262" y2="320"/>
    <line x1="358" y1="272" x2="406" y2="320"/>
    <line x1="166" y1="320" x2="214" y2="368"/>
  </g>
  <!-- Middle snake (3,2) to (5,4) on diagonal k = 1 -->
  <line x1="214" y1="176" x2="310" y2="272" stroke="#64748B" stroke-opacity="0.35" stroke-width="14" stroke-linecap="round"/>
  <!-- One shortest path, D = 5 steps that are not diagonals -->
  <polyline points="70,80 118,80 166,80 214,128 214,176 310,272 358,272 406,320 406,368" fill="none" stroke="#0F172A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Lattice points -->
  <g fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5">
    <circle cx="214" cy="80" r="3"/>
    <circle cx="262" cy="80" r="3"/>
    <circle cx="310" cy="80" r="3"/>
    <circle cx="358" cy="80" r="3"/>
    <circle cx="406" cy="80" r="3"/>
    <circle cx="70" cy="128" r="3"/>
    <circle cx="118" cy="128" r="3"/>
    <circle cx="166" cy="128" r="3"/>
    <circle cx="262" cy="128" r="3"/>
    <circle cx="310" cy="128" r="3"/>
    <circle cx="358" cy="128" r="3"/>
    <circle cx="406" cy="128" r="3"/>
    <circle cx="70" cy="176" r="3"/>
    <circle cx="118" cy="176" r="3"/>
    <circle cx="166" cy="176" r="3"/>
    <circle cx="262" cy="176" r="3"/>
    <circle cx="310" cy="176" r="3"/>
    <circle cx="358" cy="176" r="3"/>
    <circle cx="406" cy="176" r="3"/>
    <circle cx="70" cy="224" r="3"/>
    <circle cx="118" cy="224" r="3"/>
    <circle cx="166" cy="224" r="3"/>
    <circle cx="214" cy="224" r="3"/>
    <circle cx="262" cy="224" r="3"/>
    <circle cx="310" cy="224" r="3"/>
    <circle cx="358" cy="224" r="3"/>
    <circle cx="406" cy="224" r="3"/>
    <circle cx="70" cy="272" r="3"/>
    <circle cx="118" cy="272" r="3"/>
    <circle cx="166" cy="272" r="3"/>
    <circle cx="214" cy="272" r="3"/>
    <circle cx="262" cy="272" r="3"/>
    <circle cx="406" cy="272" r="3"/>
    <circle cx="70" cy="320" r="3"/>
    <circle cx="118" cy="320" r="3"/>
    <circle cx="166" cy="320" r="3"/>
    <circle cx="214" cy="320" r="3"/>
    <circle cx="262" cy="320" r="3"/>
    <circle cx="310" cy="320" r="3"/>
    <circle cx="358" cy="320" r="3"/>
    <circle cx="70" cy="368" r="3"/>
    <circle cx="118" cy="368" r="3"/>
    <circle cx="166" cy="368" r="3"/>
    <circle cx="214" cy="368" r="3"/>
    <circle cx="262" cy="368" r="3"/>
    <circle cx="310" cy="368" r="3"/>
    <circle cx="358" cy="368" r="3"/>
  </g>
  <g fill="#0F172A">
    <circle cx="70" cy="80" r="4.5"/>
    <circle cx="118" cy="80" r="4.5"/>
    <circle cx="166" cy="80" r="4.5"/>
    <circle cx="214" cy="128" r="4.5"/>
    <circle cx="214" cy="176" r="4.5"/>
    <circle cx="310" cy="272" r="4.5"/>
    <circle cx="358" cy="272" r="4.5"/>
    <circle cx="406" cy="320" r="4.5"/>
    <circle cx="406" cy="368" r="4.5"/>
  </g>
  <text x="62" y="74" font-size="11" fill="#0F172A" text-anchor="end">(0,0)</text>
  <text x="414" y="384" font-size="11" fill="#0F172A">(7,6)</text>
  <!-- Right-hand explanation -->
  <g font-size="12" fill="#0F172A">
    <text x="480" y="96" font-weight="bold">Lesart</text>
    <text x="480" y="114">Rechts löscht ein Element von a,</text>
    <text x="480" y="130">unten fügt eines von b ein.</text>
    <text x="480" y="146">Eine Diagonale kostet nichts und</text>
    <text x="480" y="162">gibt es nur, wo a[x] = b[y] gilt.</text>
    <text x="480" y="200" font-weight="bold">Der Weg</text>
    <text x="480" y="218">Ein kürzester Weg von (0,0) nach</text>
    <text x="480" y="234">(7,6) hat D = 5 Schritte, die keine</text>
    <text x="480" y="250">Diagonale sind: zwei Löschungen,</text>
    <text x="480" y="266">eine Einfügung, eine Löschung und</text>
    <text x="480" y="282">eine Einfügung.</text>
    <text x="480" y="318" font-weight="bold">Die Suchen</text>
    <text x="480" y="336">Die Vorwärtssuche erreicht nach</text>
    <text x="480" y="352">3 Änderungen (3,2) und läuft die</text>
    <text x="480" y="368">Schlange bis (5,4) ab. Die Rück-</text>
    <text x="480" y="384">wärtssuche erreicht vom Ende her</text>
    <text x="480" y="400">nach 2 Änderungen (5,4); 3 + 2 = D.</text>
  </g>
  <!-- Legend -->
  <g font-size="12" fill="#0F172A">
    <line x1="70" y1="440" x2="96" y2="440" stroke="#64748B" stroke-width="1.5"/>
    <text x="102" y="444">Diagonale (gleiche Elemente)</text>
    <line x1="290" y1="440" x2="316" y2="440" stroke="#0F172A" stroke-width="3"/>
    <text x="322" y="444">kürzester Weg</text>
    <line x1="430" y1="440" x2="456" y2="440" stroke="#64748B" stroke-opacity="0.35" stroke-width="14" stroke-linecap="round"/>
    <text x="468" y="444">Mittelschlange, (3,2) bis (5,4)</text>
  </g>
</svg>
