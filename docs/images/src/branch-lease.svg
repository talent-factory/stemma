<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="Helvetica, Arial, sans-serif">
<title>Zeitachse einer Branch-Lease: Erwerb, Heartbeat, Ablauf und Übernahme</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
  </marker>
</defs>
<rect x="0" y="0" width="600" height="360" fill="#FFFFFF"/>
<!-- lane labels -->
<g font-size="12" font-weight="bold" fill="#0F172A">
  <text x="10" y="44">Akteur A</text>
  <text x="10" y="144">Server</text>
  <text x="10" y="244">Akteur B</text>
</g>
<g font-size="11" fill="#64748B">
  <text x="10" y="58">Schreibinhaber</text>
  <text x="10" y="158">erzwingt die Lease</text>
  <text x="10" y="258">will schreiben</text>
</g>
<!-- lane lines -->
<g stroke="#E2E8F0" stroke-width="1">
  <line x1="110" y1="50" x2="590" y2="50"/>
  <line x1="110" y1="150" x2="590" y2="150"/>
  <line x1="110" y1="250" x2="590" y2="250"/>
</g>
<!-- lease bar on server lane -->
<rect x="150" y="136" width="230" height="28" rx="4" fill="#FFFFFF" stroke="#2F7D32" stroke-width="2"/>
<text x="265" y="154" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2F7D32">Lease von A</text>
<rect x="440" y="136" width="150" height="28" rx="4" fill="#FFFFFF" stroke="#2F7D32" stroke-width="2"/>
<text x="515" y="154" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2F7D32">Lease von B</text>
<!-- gap marker: free branch -->
<text x="410" y="154" text-anchor="middle" font-size="11" fill="#64748B">frei</text>
<!-- A: acquire -->
<circle cx="150" cy="50" r="5" fill="#2F7D32"/>
<line x1="150" y1="55" x2="150" y2="134" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="156" y="96" font-size="11" fill="#0F172A">1 Erwerb</text>
<!-- heartbeats -->
<g fill="#2F7D32">
  <circle cx="200" cy="50" r="3.5"/>
  <circle cx="250" cy="50" r="3.5"/>
  <circle cx="300" cy="50" r="3.5"/>
</g>
<g stroke="#64748B" stroke-width="1" marker-end="url(#arrow)">
  <line x1="200" y1="55" x2="200" y2="134"/>
  <line x1="250" y1="55" x2="250" y2="134"/>
  <line x1="300" y1="55" x2="300" y2="134"/>
</g>
<text x="250" y="30" text-anchor="middle" font-size="11" fill="#0F172A">2 Heartbeats verlängern die Lease</text>
<!-- crash of A -->
<line x1="320" y1="30" x2="320" y2="120" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="326" y="76" font-size="11" fill="#B91C1C">3 A stürzt ab,</text>
<text x="326" y="90" font-size="11" fill="#B91C1C">Die Lease gilt bis zum Ablauf,</text>
<text x="326" y="104" font-size="11" fill="#B91C1C">der Branch bleibt gesperrt</text>
<!-- expiry -->
<line x1="380" y1="124" x2="380" y2="176" stroke="#64748B" stroke-width="1.5"/>
<text x="384" y="182" font-size="11" fill="#0F172A">4 Ablauf</text>
<!-- B attempt before expiry -->
<circle cx="230" cy="250" r="5" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
<line x1="230" y1="245" x2="230" y2="166" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<text x="238" y="214" font-size="11" fill="#0F172A">Schreiben abgelehnt:</text>
<text x="238" y="228" font-size="11" fill="#0F172A">nur ein Schreibinhaber</text>
<!-- B acquires after expiry -->
<circle cx="440" cy="250" r="5" fill="#2F7D32"/>
<line x1="440" y1="245" x2="440" y2="166" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="448" y="214" font-size="11" fill="#0F172A">5 Erwerb durch B</text>
<!-- override -->
<rect x="110" y="286" width="480" height="62" rx="4" fill="#FFFFFF" stroke="#6B46C1" stroke-width="1.5"/>
<text x="122" y="306" font-size="12" font-weight="bold" fill="#6B46C1">Owner-Override (Alternative zu 4 und 5)</text>
<text x="122" y="322" font-size="11" fill="#0F172A">Nur die Rolle Owner, mit Begründung und Audit-Eintrag, ohne auf den Ablauf zu warten.</text>
<text x="122" y="337" font-size="11" fill="#0F172A">Der Override umgeht das Merge-Gate nie. Die Dauer der Lease ist noch offen.</text>
</svg>
