<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 356" font-family="Helvetica, Arial, sans-serif">
  <title>Phasen des Projekts</title>

  <!-- Spine; a filled marker is a completed phase -->
  <line x1="40" y1="40" x2="40" y2="320" stroke="#0F172A" stroke-width="2"/>

  <!-- Phase markers, all drawn alike -->
  <g fill="#FFFFFF" stroke="#0F172A" stroke-width="2">
    <circle cx="40" cy="40" r="16" fill="#0F172A"/>
    <circle cx="40" cy="96" r="16"/>
    <circle cx="40" cy="152" r="16"/>
    <circle cx="40" cy="208" r="16"/>
    <circle cx="40" cy="264" r="16"/>
    <circle cx="40" cy="320" r="16"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="bold" fill="#0F172A">
    <text x="40" y="45" fill="#FFFFFF">1</text>
    <text x="40" y="101">2</text>
    <text x="40" y="157">3</text>
    <text x="40" y="213">4</text>
    <text x="40" y="269">5</text>
    <text x="40" y="325">6</text>
  </g>

  <!-- Phase names -->
  <g font-size="15" font-weight="bold" fill="#0F172A">
    <text x="72" y="36">Lokaler Kern</text>
    <text x="72" y="92">Diff und Ausgabe</text>
    <text x="72" y="148">Branches und Merge</text>
    <text x="72" y="204">Akteure und Zusammenarbeit</text>
    <text x="72" y="260">Netzwerk und Hub</text>
    <text x="72" y="316">Agenten-Schnittstellen</text>
  </g>

  <!-- Goal of each phase, taken from the section "Ziel" of its chapter -->
  <g font-size="12" fill="#64748B">
    <text x="72" y="55">Ein Repository, ein Akteur: Commits, Status, Operation Log, Restore, Purge</text>
    <text x="72" y="111">Änderungen zwischen Working-Copy-Commit und Commits lesbar anzeigen</text>
    <text x="72" y="167">Parallele Arbeit lokal: Branches anlegen, wechseln, zusammenführen</text>
    <text x="72" y="223">Schreibhoheit, Pull Requests und Freigaben im System erzwingen</text>
    <text x="72" y="279">Klone und Server synchronisieren, der Server setzt Berechtigungen durch</text>
    <text x="72" y="335">Agenten arbeiten über Werkzeuge, jeder Aufruf autorisiert und protokolliert</text>
  </g>

  <!-- Chapter of each phase -->
  <g font-size="12" fill="#64748B" text-anchor="end">
    <text x="680" y="36">Kapitel 4, abgeschlossen</text>
    <text x="680" y="92">Kapitel 5</text>
    <text x="680" y="148">Kapitel 6</text>
    <text x="680" y="204">Kapitel 7</text>
    <text x="680" y="260">Kapitel 8</text>
    <text x="680" y="316">Kapitel 9</text>
  </g>
</svg>
