<text x="655.0" y="383.0" font-size="12" text-anchor="middle" fill="#2F7D32">da</text>
<line x1="20" y1="409.0" x2="710" y2="409.0" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="20" y="424.0" font-size="12" fill="#B91C1C">Absturz hier: halb entfernt, nicht in der Liste, hält keinen Branch mehr; bei einem Fehler Exit-Code 3.</text>
