<text x="20" y="258.0" font-size="12" fill="#B91C1C">Absturz hier: das Verzeichnis liegt unter <tspan font-family="Courier, monospace">.stemma-removing-NAME-PID</tspan> neben dem Pfad;</text>
<text x="20" y="272.0" font-size="12" fill="#B91C1C">der Worktree bleibt in der Liste, sein Branch belegt; bei einem Fehler Exit-Code 3.</text>
