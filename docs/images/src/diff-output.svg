<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" font-family="Helvetica, Arial, sans-serif">
<title>Ausgabe von diff: Oberfläche, Pager oder reiner Text</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
  </marker>
</defs>
<rect x="0" y="0" width="850" height="500" fill="#FFFFFF"/>
<g stroke="#64748B" stroke-width="1" fill="#FFFFFF">
  <rect x="325" y="20" width="200" height="56" rx="4"/>
  <rect x="30" y="26" width="200" height="44" rx="4"/>
  <rect x="325" y="120" width="200" height="44" rx="4"/>
  <rect x="325" y="200" width="200" height="44" rx="4"/>
  <rect x="30" y="200" width="200" height="44" rx="4"/>
  <rect x="325" y="290" width="200" height="56" rx="4"/>
  <rect x="620" y="290" width="200" height="56" rx="4"/>
  <rect x="325" y="400" width="200" height="64" rx="4"/>
  <rect x="620" y="400" width="200" height="64" rx="4"/>
</g>
<g font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">
  <text x="425" y="42">mit --tui, aber ohne</text>
  <text x="425" y="146">Diff aus dem Kern</text>
  <text x="425" y="226">mit --tui?</text>
  <text x="130" y="226">Oberfläche</text>
  <text x="425" y="314">Standardausgabe ist</text>
</g>
<g font-size="12" fill="#0F172A" text-anchor="middle">
  <text x="425" y="58">Terminal (oder unter Windows)?</text>
  <text x="130" y="44">Exit-Code 1,</text>
  <text x="130" y="60">bevor der Befehl etwas liest</text>
  <text x="425" y="330">ein Terminal (Unix)?</text>
  <text x="425" y="422">Text mit Farbe</text>
  <text x="425" y="438">an den Pager</text>
  <text x="425" y="454" font-family="Courier, monospace">sh -c "${PAGER:-less}"</text>
  <text x="720" y="312">Text ohne Farbe</text>
  <text x="720" y="328">auf die Standardausgabe</text>
  <text x="720" y="422">Text mit Farbe ungefiltert</text>
  <text x="720" y="438">auf die Standardausgabe,</text>
  <text x="720" y="454">Hinweis auf stderr</text>
</g>
<g font-size="11" fill="#64748B" text-anchor="middle">
  <text x="720" y="366">für Pipes und Dateien</text>
  <text x="720" y="484">Pager startet nicht oder Exit-Code 126, 127</text>
</g>
<g stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)">
  <line x1="323" y1="48" x2="232" y2="48"/>
  <line x1="425" y1="76" x2="425" y2="118"/>
  <line x1="425" y1="164" x2="425" y2="198"/>
  <line x1="323" y1="222" x2="232" y2="222"/>
  <line x1="425" y1="244" x2="425" y2="288"/>
  <line x1="527" y1="318" x2="618" y2="318"/>
  <line x1="425" y1="346" x2="425" y2="398"/>
  <line x1="527" y1="432" x2="618" y2="432"/>
</g>
<g font-size="12" fill="#0F172A" text-anchor="middle">
  <text x="277" y="40">ja</text>
  <text x="440" y="102">nein</text>
  <text x="277" y="214">ja</text>
  <text x="440" y="272">nein</text>
  <text x="572" y="310">nein</text>
  <text x="440" y="376">ja</text>
</g>
</svg>
