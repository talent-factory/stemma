<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" font-family="Helvetica, Arial, sans-serif">
<title>Ausgabe von diff: Oberfläche, Pager oder reiner Text</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
  </marker>
</defs>
<rect x="0" y="0" width="850" height="420" fill="#FFFFFF"/>
<g stroke="#64748B" stroke-width="1" fill="#FFFFFF">
  <rect x="325" y="20" width="200" height="44" rx="4"/>
  <rect x="325" y="110" width="200" height="44" rx="4"/>
  <rect x="325" y="210" width="200" height="56" rx="4"/>
  <rect x="325" y="320" width="200" height="64" rx="4"/>
  <rect x="30" y="110" width="200" height="44" rx="4"/>
  <rect x="620" y="210" width="200" height="56" rx="4"/>
  <rect x="620" y="320" width="200" height="64" rx="4"/>
</g>
<g font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">
  <text x="425" y="46">Diff aus dem Kern</text>
  <text x="425" y="136">mit --tui?</text>
  <text x="425" y="234">Standardausgabe ist</text>
  <text x="130" y="136">Oberfläche</text>
</g>
<g font-size="12" fill="#0F172A" text-anchor="middle">
  <text x="425" y="250">ein Terminal (Unix)?</text>
  <text x="425" y="342">Text mit Farbe</text>
  <text x="425" y="358">an den Pager</text>
  <text x="425" y="374" font-family="Courier, monospace">sh -c "$PAGER"</text>
  <text x="720" y="232">Text ohne Farbe</text>
  <text x="720" y="248">auf die Standardausgabe</text>
  <text x="720" y="342">Text ohne Farbe auf die</text>
  <text x="720" y="358">Standardausgabe, Hinweis</text>
  <text x="720" y="374">auf stderr</text>
</g>
<g font-size="11" fill="#64748B" text-anchor="middle">
  <text x="130" y="172">ohne Terminal: Exit-Code 1,</text>
  <text x="130" y="186">bevor der Befehl etwas liest</text>
  <text x="720" y="296">für Pipes und Dateien</text>
  <text x="720" y="406">Pager startet nicht oder Exit-Code 126, 127</text>
</g>
<g stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)">
  <line x1="425" y1="64" x2="425" y2="108"/>
  <line x1="323" y1="132" x2="232" y2="132"/>
  <line x1="425" y1="154" x2="425" y2="208"/>
  <line x1="425" y1="266" x2="425" y2="318"/>
  <line x1="527" y1="238" x2="618" y2="238"/>
  <line x1="527" y1="352" x2="618" y2="352"/>
</g>
<g font-size="12" font-family="Courier, monospace" fill="#0F172A" text-anchor="middle">
  <text x="277" y="124">ja</text>
  <text x="440" y="186">nein</text>
  <text x="440" y="296">ja</text>
  <text x="572" y="230">nein</text>
</g>
</svg>
