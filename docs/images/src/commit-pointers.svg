<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 760" font-family="Helvetica, Arial, sans-serif">
<title>Zeiger vor und nach commit, mit dem Zustand nach einem Absturz</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#2F7D32"/>
  </marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#B45309"/>
  </marker>
</defs>
<rect x="0" y="0" width="580" height="760" fill="#FFFFFF"/>
<g font-size="13" font-weight="bold" fill="#0F172A">
  <text x="20" y="22">Vor <tspan font-family="Courier, monospace">commit -m "Gruss erweitern"</tspan></text>
  <text x="20" y="206" fill="#B91C1C">Absturz zwischen den beiden Zeigerbewegungen</text>
  <text x="20" y="512">Nach dem Commit</text>
</g>
<!-- Crash point: what remains after a crash between the two pointer moves -->
<line x1="20" y1="186" x2="560" y2="186" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="6 4"/>
<!-- Commits: grey frame named commit, orange frame for working-copy commit -->
<g stroke-width="1.5" fill="#FFFFFF">
  <rect x="20" y="72" width="160" height="86" rx="4" stroke="#64748B"/>
  <rect x="210" y="72" width="160" height="86" rx="4" stroke="#B45309"/>
  <rect x="20" y="272" width="160" height="86" rx="4" stroke="#64748B"/>
  <rect x="210" y="272" width="160" height="86" rx="4" stroke="#64748B"/>
  <rect x="400" y="272" width="160" height="86" rx="4" stroke="#64748B"/>
  <rect x="210" y="378" width="160" height="86" rx="4" stroke="#B45309"/>
  <rect x="20" y="562" width="160" height="86" rx="4" stroke="#64748B"/>
  <rect x="210" y="562" width="160" height="86" rx="4" stroke="#64748B"/>
  <rect x="400" y="562" width="160" height="86" rx="4" stroke="#B45309"/>
</g>
<g font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#0F172A">
  <text x="30" y="92">b3:2037…</text>
  <text x="220" y="92" fill="#B45309">b3:7694…</text>
  <text x="30" y="292">b3:2037…</text>
  <text x="220" y="292">b3:9d8a…</text>
  <text x="410" y="292">b3:e394…</text>
  <text x="220" y="398" fill="#B45309">b3:7694…</text>
  <text x="30" y="582">b3:2037…</text>
  <text x="220" y="582">b3:9d8a…</text>
  <text x="410" y="582" fill="#B45309">b3:e394…</text>
</g>
<g font-size="12" fill="#0F172A">
  <text x="30" y="110">Erste Fassung</text>
  <text x="220" y="110" fill="#64748B" font-style="italic">leere Nachricht</text>
  <text x="30" y="310">Erste Fassung</text>
  <text x="220" y="310">Gruss erweitern</text>
  <text x="410" y="310" fill="#64748B" font-style="italic">leere Nachricht</text>
  <text x="220" y="416" fill="#64748B" font-style="italic">leere Nachricht</text>
  <text x="30" y="600">Erste Fassung</text>
  <text x="220" y="600">Gruss erweitern</text>
  <text x="410" y="600" fill="#64748B" font-style="italic">leere Nachricht</text>
</g>
<g font-family="Courier, monospace" font-size="11" fill="#64748B">
  <text x="30" y="128">ch:c52e…</text>
  <text x="30" y="146">Baum b3:dd8a…</text>
  <text x="220" y="128">ch:bf9e…</text>
  <text x="220" y="146">Baum b3:9707…</text>
  <text x="30" y="328">ch:c52e…</text>
  <text x="30" y="346">Baum b3:dd8a…</text>
  <text x="220" y="328">ch:bf9e…</text>
  <text x="220" y="346">Baum b3:9707…</text>
  <text x="410" y="328">ch:5bf7…</text>
  <text x="410" y="346">Baum b3:9707…</text>
  <text x="220" y="434">ch:bf9e…</text>
  <text x="220" y="452">Baum b3:9707…</text>
  <text x="30" y="618">ch:c52e…</text>
  <text x="30" y="636">Baum b3:dd8a…</text>
  <text x="220" y="618">ch:bf9e…</text>
  <text x="220" y="636">Baum b3:9707…</text>
  <text x="410" y="618">ch:5bf7…</text>
  <text x="410" y="636">Baum b3:9707…</text>
</g>
<!-- Parent arrows: from commit to parent -->
<g stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)">
  <line x1="210" y1="115" x2="182" y2="115"/>
  <line x1="210" y1="315" x2="182" y2="315"/>
  <line x1="400" y1="315" x2="372" y2="315"/>
  <line x1="210" y1="421" x2="150" y2="361"/>
  <line x1="210" y1="605" x2="182" y2="605"/>
  <line x1="400" y1="605" x2="372" y2="605"/>
</g>
<!-- Pointers -->
<g stroke-width="1.5" fill="#FFFFFF">
  <rect x="20" y="36" width="50" height="20" rx="3" stroke="#2F7D32"/>
  <rect x="96" y="36" width="54" height="20" rx="3" stroke="#2F7D32"/>
  <rect x="235" y="36" width="110" height="20" rx="3" stroke="#B45309"/>
  <rect x="210" y="236" width="50" height="20" rx="3" stroke="#2F7D32"/>
  <rect x="286" y="236" width="54" height="20" rx="3" stroke="#2F7D32"/>
  <rect x="400" y="411" width="110" height="20" rx="3" stroke="#B45309"/>
  <rect x="210" y="526" width="50" height="20" rx="3" stroke="#2F7D32"/>
  <rect x="286" y="526" width="54" height="20" rx="3" stroke="#2F7D32"/>
  <rect x="425" y="526" width="110" height="20" rx="3" stroke="#B45309"/>
</g>
<g font-family="Courier, monospace" font-size="12" font-weight="bold" text-anchor="middle">
  <text x="45" y="50" fill="#2F7D32">HEAD</text>
  <text x="123" y="50" fill="#2F7D32">main</text>
  <text x="290" y="50" fill="#B45309">working-copy</text>
  <text x="235" y="250" fill="#2F7D32">HEAD</text>
  <text x="313" y="250" fill="#2F7D32">main</text>
  <text x="455" y="425" fill="#B45309">working-copy</text>
  <text x="235" y="540" fill="#2F7D32">HEAD</text>
  <text x="313" y="540" fill="#2F7D32">main</text>
  <text x="480" y="540" fill="#B45309">working-copy</text>
</g>
<g stroke-width="1.5">
  <line x1="70" y1="46" x2="94" y2="46" stroke="#2F7D32" marker-end="url(#arrow-green)"/>
  <line x1="123" y1="56" x2="123" y2="70" stroke="#2F7D32" marker-end="url(#arrow-green)"/>
  <line x1="290" y1="56" x2="290" y2="70" stroke="#B45309" marker-end="url(#arrow-orange)"/>
  <line x1="260" y1="246" x2="284" y2="246" stroke="#2F7D32" marker-end="url(#arrow-green)"/>
  <line x1="313" y1="256" x2="313" y2="270" stroke="#2F7D32" marker-end="url(#arrow-green)"/>
  <line x1="400" y1="421" x2="372" y2="421" stroke="#B45309" marker-end="url(#arrow-orange)"/>
  <line x1="260" y1="536" x2="284" y2="536" stroke="#2F7D32" marker-end="url(#arrow-green)"/>
  <line x1="313" y1="546" x2="313" y2="560" stroke="#2F7D32" marker-end="url(#arrow-green)"/>
  <line x1="480" y1="546" x2="480" y2="560" stroke="#B45309" marker-end="url(#arrow-orange)"/>
</g>
<!-- Explanation -->
<g font-size="12" fill="#0F172A">
  <text x="400" y="98">Die Pfeile zwischen den</text>
  <text x="400" y="114">Commits zeigen auf den</text>
  <text x="400" y="130">Elternteil.</text>
  <text x="20" y="224" fill="#B91C1C">Es bleiben: Eintrag 5, <tspan font-family="Courier, monospace">main</tspan> auf dem benannten Commit, <tspan font-family="Courier, monospace">working-copy</tspan> noch alt.</text>
  <text x="20" y="682"><tspan font-family="Courier, monospace">b3:9d8a…</tspan> ist <tspan font-family="Courier, monospace">b3:7694…</tspan> mit Nachricht, Akteur und Zeit des Aufrufs:</text>
  <text x="20" y="698">gleicher Baum, gleiche Eltern, gleiche Change-ID.</text>
  <text x="20" y="714"><tspan font-family="Courier, monospace">b3:7694…</tspan> bleibt ohne Zeiger liegen.</text>
  <text x="20" y="738">Nach dem Absturz nennt das Log den Ausgang von Eintrag 5 unbekannt, solange die Sperre liegt;</text>
  <text x="20" y="754">der nächste <tspan font-family="Courier, monospace">commit</tspan> übernimmt sie und beendet den ersten mit einem eigenen Eintrag.</text>
</g>
</svg>
