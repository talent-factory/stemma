<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 462" font-family="Helvetica, Arial, sans-serif">
<title>Ablauf einer Freigabe mit Absturzpunkten: vom Signieren bis zur Beweisdatei</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F7D32"/></marker>
  <marker id="arrow-crash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker>
</defs>
<rect x="0" y="0" width="580" height="462" fill="#FFFFFF"/>
<rect x="20" y="20" width="250" height="46" rx="4" stroke="#64748B" stroke-width="1" fill="#FFFFFF"/>
<rect x="20" y="20" width="8" height="46" fill="#64748B"/>
<text x="40" y="39" font-size="13" font-weight="bold" fill="#0F172A">1  Kopf signieren</text>
<text x="56" y="57" font-size="11.5" fill="#64748B">Nummer und Kopf, mit dem Schlüssel</text>
<line x1="145" y1="66" x2="145" y2="94" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="20" y="96" width="250" height="46" rx="4" stroke="#64748B" stroke-width="1" fill="#FFFFFF"/>
<rect x="20" y="96" width="8" height="46" fill="#64748B"/>
<text x="40" y="115" font-size="13" font-weight="bold" fill="#0F172A">2  Sperre nehmen, prüfen</text>
<text x="56" y="133" font-size="11.5" fill="#64748B">offen? Kopf gleich? Signatur gültig?</text>
<line x1="145" y1="142" x2="145" y2="170" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="20" y="172" width="250" height="46" rx="4" stroke="#64748B" stroke-width="1" fill="#FFFFFF"/>
<rect x="20" y="172" width="8" height="46" fill="#6B46C1"/>
<text x="40" y="191" font-size="13" font-weight="bold" fill="#6B46C1">3  Eintrag <tspan font-family="Courier, monospace">pr-approve</tspan></text>
<text x="56" y="209" font-size="11.5" fill="#64748B">Nummer und Kopf, gesichert</text>
<line x1="145" y1="218" x2="145" y2="246" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="20" y="248" width="250" height="46" rx="4" stroke="#64748B" stroke-width="1" fill="#FFFFFF"/>
<rect x="20" y="248" width="8" height="46" fill="#6B46C1"/>
<text x="40" y="267" font-size="13" font-weight="bold" fill="#6B46C1">4  Beweis schreiben</text>
<text x="56" y="285" font-size="11.5" fill="#64748B"><tspan font-family="Courier, monospace">.stemma/proofs/&lt;Nummer&gt;</tspan></text>
<line x1="145" y1="294" x2="145" y2="322" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="20" y="324" width="250" height="46" rx="4" stroke="#64748B" stroke-width="1" fill="#FFFFFF"/>
<rect x="20" y="324" width="8" height="46" fill="#64748B"/>
<text x="40" y="343" font-size="13" font-weight="bold" fill="#0F172A">5  Sperre freigeben</text>
<text x="56" y="361" font-size="11.5" fill="#64748B"><tspan font-family="Courier, monospace">refs.lock</tspan> entfernen</text>
<line x1="20" y1="157" x2="292" y2="157" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="302" y="153" font-size="12.5" font-weight="bold" fill="#B91C1C">Absturz: kein Eintrag</text>
<text x="302" y="170" font-size="12" fill="#0F172A">Das Log ist unverändert. Der Reviewer</text>
<text x="302" y="185" font-size="12" fill="#0F172A">gibt den Kopf noch einmal frei.</text>
<line x1="20" y1="233" x2="292" y2="233" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="302" y="229" font-size="12.5" font-weight="bold" fill="#B91C1C">Absturz: Eintrag ohne Beweis</text>
<text x="302" y="246" font-size="12" fill="#0F172A">Die Freigabe steht im Log, zählt aber</text>
<text x="302" y="261" font-size="12" fill="#0F172A">nicht, auch nicht in der Neuzählung.</text>
<text x="302" y="276" font-size="12" fill="#0F172A">Der Ausfall geht auf die sichere Seite.</text>
<line x1="20" y1="309" x2="292" y2="309" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="302" y="305" font-size="12.5" font-weight="bold" fill="#B91C1C">Absturz: Eintrag und Beweis stehen</text>
<text x="302" y="322" font-size="12" fill="#0F172A">Die Freigabe zählt; nur die Sperre</text>
<text x="302" y="337" font-size="12" fill="#0F172A">bleibt liegen.</text>
<text x="20" y="410" font-size="11.5" fill="#64748B">Bewegt sich der Kopf beim Signieren, schreibt der Kern nichts. Im offenen Modus</text>
<text x="20" y="426" font-size="11.5" fill="#64748B">gibt es kein Register, keine Signatur und keine Beweisdatei (Schritte 1 und 4).</text>
</svg>
