<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 484" font-family="Helvetica, Arial, sans-serif">
<title>Verlauf und Log vor und nach einem Purge</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#2F7D32"/>
  </marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#B45309"/>
  </marker>
</defs>
<rect x="0" y="0" width="600" height="484" fill="#FFFFFF"/>
<g font-size="13" font-weight="bold" fill="#0F172A">
  <text x="10" y="20">Vor dem Purge</text>
  <text x="10" y="226">Nach dem Purge</text>
</g>
<text x="490" y="20" font-size="13" font-weight="bold" fill="#6B46C1">Operation Log</text>
<!-- Commits -->
<g stroke-width="1.5" fill="#FFFFFF">
  <rect x="10" y="66" width="135" height="86" rx="4" stroke="#64748B"/>
  <rect x="165" y="66" width="135" height="86" rx="4" stroke="#64748B"/>
  <rect x="320" y="66" width="135" height="86" rx="4" stroke="#B45309"/>
  <rect x="10" y="272" width="135" height="86" rx="4" stroke="#64748B"/>
  <rect x="165" y="272" width="135" height="86" rx="4" stroke="#64748B"/>
  <rect x="320" y="272" width="135" height="86" rx="4" stroke="#B45309"/>
</g>
<g font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#0F172A">
  <text x="20" y="86">b3:2037…</text>
  <text x="175" y="86">b3:930a…</text>
  <text x="330" y="86" fill="#B45309">b3:f082…</text>
  <text x="20" y="292">b3:2037…</text>
  <text x="175" y="292">b3:dd97…</text>
  <text x="330" y="292" fill="#B45309">b3:35cb…</text>
</g>
<g font-size="12" fill="#0F172A">
  <text x="20" y="104">Erste Fassung</text>
  <text x="175" y="104">Zugang</text>
  <text x="330" y="104" fill="#64748B" font-style="italic">leere Nachricht</text>
  <text x="20" y="310">Erste Fassung</text>
  <text x="175" y="310">Zugang</text>
  <text x="330" y="310" fill="#64748B" font-style="italic">leere Nachricht</text>
</g>
<g font-family="Courier, monospace" font-size="11" fill="#64748B">
  <text x="20" y="122">ch:c52e…</text>
  <text x="20" y="140">Baum b3:dd8a…</text>
  <text x="175" y="122">ch:bf9e…</text>
  <text x="175" y="140" fill="#0F172A" font-weight="bold">Baum b3:4094…</text>
  <text x="330" y="122">ch:f9f0…</text>
  <text x="330" y="140" fill="#0F172A" font-weight="bold">Baum b3:4094…</text>
  <text x="20" y="328">ch:c52e…</text>
  <text x="20" y="346">Baum b3:dd8a…</text>
  <text x="175" y="328">ch:bf9e…</text>
  <text x="175" y="346">Baum b3:9707…</text>
  <text x="330" y="328">ch:f9f0…</text>
  <text x="330" y="346">Baum b3:9707…</text>
</g>
<text x="175" y="166" font-size="11" fill="#0F172A">Baum mit <tspan font-family="Courier, monospace">.env</tspan> und dem Blob</text>
<!-- Parent arrows -->
<g stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)">
  <line x1="165" y1="109" x2="147" y2="109"/>
  <line x1="320" y1="109" x2="302" y2="109"/>
  <line x1="165" y1="315" x2="147" y2="315"/>
  <line x1="320" y1="315" x2="302" y2="315"/>
</g>
<!-- Pointers -->
<g stroke-width="1.5" fill="#FFFFFF">
  <rect x="205" y="32" width="54" height="20" rx="3" stroke="#2F7D32"/>
  <rect x="333" y="32" width="110" height="20" rx="3" stroke="#B45309"/>
  <rect x="205" y="238" width="54" height="20" rx="3" stroke="#2F7D32"/>
  <rect x="333" y="238" width="110" height="20" rx="3" stroke="#B45309"/>
</g>
<g font-family="Courier, monospace" font-size="12" font-weight="bold" text-anchor="middle">
  <text x="232" y="46" fill="#2F7D32">main</text>
  <text x="388" y="46" fill="#B45309">working-copy</text>
  <text x="232" y="252" fill="#2F7D32">main</text>
  <text x="388" y="252" fill="#B45309">working-copy</text>
</g>
<g stroke-width="1.5">
  <line x1="232" y1="52" x2="232" y2="64" stroke="#2F7D32" marker-end="url(#arrow-green)"/>
  <line x1="388" y1="52" x2="388" y2="64" stroke="#B45309" marker-end="url(#arrow-orange)"/>
  <line x1="232" y1="258" x2="232" y2="270" stroke="#2F7D32" marker-end="url(#arrow-green)"/>
  <line x1="388" y1="258" x2="388" y2="270" stroke="#B45309" marker-end="url(#arrow-orange)"/>
</g>
<!-- Log entries -->
<g stroke="#6B46C1" stroke-width="1.5" fill="#FFFFFF">
  <rect x="490" y="66" width="100" height="26" rx="3"/>
  <rect x="490" y="98" width="100" height="26" rx="3"/>
  <rect x="490" y="272" width="100" height="26" rx="3" stroke-dasharray="6 4"/>
  <rect x="490" y="304" width="100" height="26" rx="3" stroke-dasharray="6 4"/>
  <rect x="490" y="336" width="100" height="26" rx="3"/>
</g>
<g font-size="12" fill="#0F172A">
  <text x="500" y="84">7 <tspan font-family="Courier, monospace">track</tspan></text>
  <text x="500" y="116">8 <tspan font-family="Courier, monospace">commit</tspan></text>
  <text x="500" y="290">7 Stub</text>
  <text x="500" y="322">8 Stub</text>
  <text x="500" y="354">9 <tspan font-family="Courier, monospace">purge</tspan></text>
</g>
<text x="490" y="140" font-size="11" fill="#64748B">nennen</text>
<text x="490" y="154" font-size="11" fill="#64748B"><tspan font-family="Courier, monospace">b3:930a…</tspan>,</text>
<text x="490" y="168" font-size="11" fill="#64748B"><tspan font-family="Courier, monospace">b3:f082…</tspan>,</text>
<text x="490" y="182" font-size="11" fill="#64748B"><tspan font-family="Courier, monospace">b3:fece…</tspan></text>
<text x="490" y="378" font-size="11" fill="#64748B">Nummer, Zeit und</text>
<text x="490" y="392" font-size="11" fill="#64748B">Akteur bleiben</text>
<!-- Explanation -->
<g font-size="12" fill="#0F172A">
  <text x="10" y="396">Die umgeschriebenen Commits behalten Change-ID, Autor, Zeit und</text>
  <text x="10" y="412">Nachricht; sie bekommen einen Baum ohne den Blob und, wenn nötig, neue Eltern.</text>
  <text x="10" y="438" fill="#64748B">Gelöscht: die Commits <tspan font-family="Courier, monospace">b3:930a…</tspan>, <tspan font-family="Courier, monospace">b3:f082…</tspan> und <tspan font-family="Courier, monospace">b3:fece…</tspan></text>
  <text x="10" y="454" fill="#64748B">(die Fassung von <tspan font-family="Courier, monospace">track</tspan>), der Baum <tspan font-family="Courier, monospace">b3:4094…</tspan></text>
  <text x="10" y="470" fill="#64748B">und der Blob <tspan font-family="Courier, monospace">b3:4cbc…</tspan>.</text>
</g>
</svg>
