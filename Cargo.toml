[workspace]
resolver = "2"
members = ["crates/stemma-core", "crates/stemma-cli", "crates/stemma-tui"]
# The fuzz targets need nightly and are built by `cargo fuzz` alone (`just fuzz`).
exclude = ["fuzz"]

[workspace.package]
version = "0.0.1"
edition = "2021"
# `File::try_lock`, which holds the guard of the lock of the references (ADR-008).
rust-version = "1.89"
license = "MIT OR Apache-2.0"
# The crates are not published to a registry yet.
publish = false
