# Configuration of `cargo deny check` (STEMMA-33): licenses, advisories, bans, and sources of the
# dependency tree.

[advisories]
# A crate that is unmaintained or yanked fails the check as well as one with a vulnerability.
unmaintained = "all"
yanked = "deny"

[licenses]
# The licenses that a dependency may carry. A dependency with a choice of licenses passes when
# one of them is listed here.
allow = ["Apache-2.0", "MIT", "Unicode-3.0"]
confidence-threshold = 0.93

# Only `foldhash` (through `hashbrown`, `lru`, and `kasuari`) carries the Zlib license, so the
# exception names the crate instead of allowing the license for the whole tree.
[[licenses.exceptions]]
crate = "foldhash"
allow = ["Zlib"]

# The dalek crates and `subtle`, which `ssh-key` needs for SSHSIG (ADR-020), carry BSD-3-Clause
# only. The exceptions name the crates instead of allowing the license for the whole tree.
[[licenses.exceptions]]
crate = "curve25519-dalek"
allow = ["BSD-3-Clause"]

[[licenses.exceptions]]
crate = "ed25519-dalek"
allow = ["BSD-3-Clause"]

[[licenses.exceptions]]
crate = "subtle"
allow = ["BSD-3-Clause"]

# rustls with `ring` and the Mozilla roots, for the TLS of the HTTP client in `stemma-remote`
# (ADR-028): `ring`, `rustls-webpki` and `untrusted` carry ISC, and `webpki-roots` carries
# CDLA-Permissive-2.0. The exceptions name the crates instead of allowing the licenses for the
# whole tree.
[[licenses.exceptions]]
crate = "ring"
allow = ["ISC"]

[[licenses.exceptions]]
crate = "rustls-webpki"
allow = ["ISC"]

[[licenses.exceptions]]
crate = "untrusted"
allow = ["ISC"]

[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

# zstd for the compression of the body in `stemma-remote` (ADR-029): the binding `zstd` and
# `zstd-safe` carry BSD-3-Clause, and `zstd-sys`, which builds the C library, carries
# BSD-3-Clause AND BSD-2-Clause. The exceptions name the crates instead of allowing the licenses
# for the whole tree.
[[licenses.exceptions]]
crate = "zstd"
allow = ["BSD-3-Clause"]

[[licenses.exceptions]]
crate = "zstd-safe"
allow = ["BSD-3-Clause"]

[[licenses.exceptions]]
crate = "zstd-sys"
allow = ["BSD-3-Clause", "BSD-2-Clause"]

[licenses.private]
# The crates of the workspace are not published (`publish = false`), so their own license is not
# checked.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A path dependency inside the workspace has no version and is not a wildcard in that sense.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
